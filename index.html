<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prompt Builder</title>
<style>
  :root{
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --border: #e2e5ea;
    --border-strong: #c9ced6;
    --text: #1a1d21;
    --text-2: #5b6270;
    --text-3: #8b919c;
    --teal: #0f8a7e;
    --teal-dim: #e3f5f2;
    --amber: #b06a00;
    --amber-dim: #fdf1de;
    --green: #157a3d;
    --green-dim: #e6f6ec;
    --rose: #c0362c;
    --rose-dim: #fbeae8;
    --mono: 'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.55;}
  .app{max-width:900px;margin:0 auto;padding:0 20px 80px;}
  h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;padding:16px 0 12px;}
  input[type=text],textarea,select{
    width:100%;background:var(--panel);border:1px solid var(--border-strong);
    color:var(--text);border-radius:6px;padding:7px 9px;font-family:var(--sans);font-size:13px;
  }
  textarea{resize:vertical;min-height:34px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);}
  .btn{
    background:var(--panel);border:1px solid var(--border-strong);color:var(--text);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn.primary:hover{opacity:.9;color:#fff;}
  .btn.orange{background:#d97706;border-color:#d97706;color:#fff;}
  .btn.orange:hover{opacity:.9;color:#fff;}
  .btn.danger{border-color:var(--rose);color:var(--rose);}

  #stickyHeader{background:var(--bg);padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .field.pinned{position:sticky;top:8px;z-index:40;background:var(--bg);padding-top:8px;padding-bottom:8px;box-shadow:0 4px 14px rgba(20,25,30,0.1);}
  #builderPanel.open{position:fixed;inset:0;z-index:1000;background:rgba(20,25,30,0.45);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;border:none;border-radius:0;max-width:none;margin:0;}
  #builderPanelInner{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,30,0.25);max-width:560px;width:100%;padding:18px;max-height:90vh;overflow-y:auto;}
  #builderSelectedPanel{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,30,0.25);width:170px;flex-shrink:0;padding:12px 10px;max-height:90vh;overflow-y:auto;}
  .selected-tag-item{padding:6px 8px;margin-bottom:5px;background:var(--panel-2);border-radius:6px;font-size:12px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;}
  .selected-tag-item:hover{background:var(--teal-dim);color:var(--teal);}
  .settings-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);padding:4px 0;flex-wrap:wrap;}
  .settings-line b{color:var(--text-2);font-weight:600;}
  .settings-panel{display:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:6px 0;}
  .settings-panel.open{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .field label{display:block;font-size:10.5px;color:var(--text-3);margin-bottom:4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}

  .toprow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}

  #contentArea{padding-top:14px;}
  .panel{background:var(--panel);border:1px dashed var(--border-strong);border-radius:8px;padding:12px;margin-bottom:14px;display:none;}
  .panel.open{display:block;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .template-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .card-name{font-weight:600;font-size:14.5px;flex:1;}
  .card-meta{font-size:10.5px;color:var(--text-3);font-family:var(--mono);}
  .badge{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.untested{background:var(--panel-2);color:var(--text-3);}
  .badge.good{background:var(--green-dim);color:var(--green);}
  .badge.needswork{background:var(--amber-dim);color:var(--amber);}
  .card-text-label{font-size:10.5px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px;}
  .card-text{font-size:13px;background:var(--panel-2);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;}
  .card-text.neg{color:var(--rose);}
  .card-note{font-size:12.5px;color:var(--text-2);font-style:italic;margin-top:8px;}
  .card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:14px;border:1px solid var(--border-strong);
    background:var(--panel);font-size:12.5px;cursor:pointer;color:var(--text-2);
  }
  .chip.active{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);font-weight:600;}
  .chip.add{border-style:dashed;color:var(--text-3);}
  .tag-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 6px 3px 10px;border-radius:12px;background:var(--teal-dim);color:var(--teal);font-size:12px;}
  .tag-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:12px;padding:0;line-height:1;opacity:.7;}
  .tag-chip button:hover{opacity:1;}
  .phrase-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;user-select:none;}
  .sub-header{user-select:none;}
  .phrase-row:last-child{border-bottom:none;}
  .phrase-row:hover{background:var(--panel);}
  .phrase-row.selected{background:var(--teal-dim);color:var(--teal);font-weight:600;}
  .phrase-row .icon-btn{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:12px;}
  .phrase-row .icon-btn:hover{color:var(--teal);}
  .phrase-row .del{margin-left:auto;background:none;border:none;color:var(--text-3);cursor:pointer;font-size:12px;}
  .phrase-row .del:hover{color:var(--rose);}
  .empty{color:var(--text-3);font-size:13px;padding:24px;text-align:center;}
  .quick-add-grid{display:grid;grid-template-columns:1fr 1fr auto;}
  .phrase-edit-grid{display:grid;grid-template-columns:1fr 1fr auto auto;}

  @media (max-width: 600px){
    .app{padding:0 12px 60px;}
    h1{font-size:16px;padding:12px 0 10px;}
    .btn{padding:8px 12px;font-size:13px;}
    .btn.small{padding:7px 10px;font-size:12px;}
    input[type=text],textarea,select{font-size:16px;padding:9px 10px;}
    .settings-line{font-size:11px;}
    .settings-panel.open{grid-template-columns:1fr;}
    .toprow{gap:6px;}
    .toprow input[type=text]{max-width:none !important;width:100%;}
    #newPromptBtn{margin-left:0 !important;width:100%;}
    .quick-add-grid{grid-template-columns:1fr;}
    .quick-add-grid button{width:100%;}
    .phrase-edit-grid{grid-template-columns:1fr;}
    .phrase-row{flex-wrap:wrap;padding:9px 10px;}
    .phrase-row input[type=checkbox]{width:18px;height:18px;}
    #builderPopupRow{flex-direction:column;}
    #builderSelectedPanel{width:100%;max-height:110px;}
    .card-name{font-size:14px;}
    .card-actions .btn{flex:1;min-width:calc(50% - 4px);}
    .form-actions{flex-wrap:wrap;}
    .form-actions .btn{flex:1;}
    .cat-row .chip{font-size:13px;padding:6px 10px;}
    .np-name-row{flex-direction:column;align-items:stretch !important;}
    .np-name-row > div{flex:none !important;width:100%;}
    .icon-btn{font-size:16px;padding:4px 6px;}
    .del{font-size:16px;padding:4px 6px;}
    .sub-header{padding:9px 10px !important;}
    #builderPanel.open{padding:0 !important;align-items:stretch !important;}
    #builderPopupRow{height:100%;}
    #builderPanelInner{max-height:none;height:100%;border-radius:0;}
    #builderSelectedPanel{max-height:96px;border-radius:0;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="loginGate" style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;">
    <h1 style="padding:0;">プロンプトビルダー</h1>
    <p style="color:var(--text-2);font-size:13.5px;max-width:320px;">Googleアカウントでログインすると、PCとスマホでデータが同期されます。</p>
    <button class="btn primary" id="googleSignInBtn" style="padding:10px 20px;font-size:14px;">Googleでログイン</button>
    <p id="loginError" style="color:var(--rose);font-size:12.5px;"></p>
  </div>
  <div id="appContent" style="display:none;">
  <h1>プロンプトビルダー</h1>
  <div id="storageWarning" style="display:none;background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;"></div>

  <div id="stickyHeader">
    <div class="settings-line">
      <span><b>TRIGGER</b> <span id="settingsSummary1"></span></span>
      <span>・</span>
      <span><b>品質タグ</b> <span id="settingsSummary2"></span></span>
      <span>・</span>
      <span><b>NEGATIVE</b> <span id="settingsSummary3"></span></span>
      <span id="userEmailLabel" style="font-size:11px;color:var(--text-3);margin-left:10px;"></span>
      <button class="btn small" id="signOutBtn" style="margin-left:6px;">ログアウト</button>
      <button class="btn small" id="settingsToggle" style="margin-left:auto;">固定設定を編集</button>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <div class="field">
        <label>Trigger word</label>
        <input type="text" id="triggerWord" placeholder="ohwx muse">
      </div>
      <div class="field">
        <label>品質タグ（参考用）</label>
        <input type="text" id="qualityPrefix" placeholder="ohwx_muse_lora, 1girl, ...">
      </div>
      <div class="field">
        <label>共通ネガティブ（参考用）</label>
        <input type="text" id="negativeCommon" placeholder="overexposed, blown highlights">
      </div>
    </div>

    <div class="toprow">
      <input type="text" id="promptSearch" placeholder="名前・本文・メモで検索…" style="max-width:280px;">
      <button class="btn primary" id="newPromptBtn" style="margin-left:auto;">+ 新しいプロンプト</button>
      <button class="btn small" id="exportBtn">バックアップ書き出し</button>
      <label class="btn small" for="importBackupFile" style="cursor:pointer;">バックアップ読み込み
        <input type="file" id="importBackupFile" accept=".json" style="display:none;">
      </label>
    </div>
    <span id="backupResult" style="font-size:11.5px;color:var(--teal);"></span>
  </div>

  <div id="contentArea">
    <div class="panel" id="newPromptForm">
      <div class="field np-name-row" style="margin-bottom:8px;display:flex;gap:8px;align-items:flex-end;">
        <div style="flex:3;">
          <label>名前</label>
          <input type="text" id="np-name" placeholder="例：丘の上セーラー服・笑顔">
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div style="display:flex;gap:6px;">
            <button class="btn small" id="np-name-cancel" title="キャンセル" style="flex:1;">✕</button>
            <button class="btn small orange" id="np-name-save" title="保存" style="flex:1;">保存</button>
          </div>
          <button class="btn small primary" id="np-name-copy-pos" style="width:100%;">Positiveをコピー</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label>サムネイル画像（任意）</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <img id="np-thumb-preview" src="" style="display:none;width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">
          <input type="file" id="np-thumb-file" accept="image/*">
          <button class="btn small" id="np-thumb-remove" style="display:none;">画像を削除</button>
        </div>
        <p id="np-thumb-status" style="font-size:11.5px;color:var(--text-3);margin:4px 0 0;"></p>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label>日本語タグ</label>
        <div class="template-row">
          <button class="btn small" id="builderToggle">ビルダーで組み立てる</button>
        </div>
        <div class="panel" id="builderPanel">
        <div id="builderPopupRow" style="display:flex;gap:12px;align-items:stretch;">
        <div id="builderSelectedPanel"></div>
        <div id="builderPanelInner">
          <datalist id="subCategoryOptions"></datalist>
          <div style="display:flex;align-items:center;margin-bottom:12px;">
            <span style="font-weight:600;font-size:15px;">タグを選ぶ</span>
            <button class="btn small" id="builderClose" style="margin-left:auto;">✕ 閉じて戻る</button>
          </div>
          <div class="cat-row" id="builderCatRow" style="display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;margin-bottom:8px;"></div>
          <div style="margin-bottom:8px;">
            <button class="btn small" id="builderImportToggle">一括インポート</button>
          </div>
          <div class="panel" id="builderImportPanel" style="margin-bottom:8px;">
            <p style="font-size:12px;color:var(--text-2);margin:0 0 8px;">
              1行1フレーズ。「カテゴリ | 日本語 | 英語タグ」の形式（Markdown表もそのまま貼り付け可）。既存カテゴリ名と一致すればそこに追加、なければ新規作成。同じ日本語のフレーズが既にあれば重複登録しません。
            </p>
            <textarea id="builderImportText" style="min-height:110px;" placeholder="衣装 | テニスウェア | tennis outfit
人物描写 | ベリーショートで眼鏡をかけた細身の男性 | very short hair, glasses, slim build"></textarea>
            <div class="form-actions">
              <button class="btn small" id="builderImportCancel">キャンセル</button>
              <button class="btn small primary" id="builderImportRun">貼り付けをインポート</button>
            </div>
            <div style="border-top:1px solid var(--border);margin:12px 0 8px;padding-top:8px;">
              <label style="display:block;font-size:11px;color:var(--text-3);margin-bottom:6px;font-family:var(--mono);text-transform:uppercase;">またはファイルから読み込む（CSV / TSV / Excel）</label>
              <input type="file" id="builderImportFile" accept=".csv,.tsv,.txt,.xlsx,.xls">
            </div>
            <p id="builderImportResult" style="font-size:12px;color:var(--teal);margin:8px 0 0;"></p>
          </div>
          <div style="margin-bottom:6px;">
            <input type="text" id="builderNewPhraseSub" list="subCategoryOptions" placeholder="サブカテゴリ（任意・例：立ち／座り／寝る）">
          </div>
          <div class="quick-add-grid" style="gap:8px;margin-bottom:8px;">
            <input type="text" id="builderNewPhraseJa" placeholder="日本語">
            <input type="text" id="builderNewPhraseEn" placeholder="英語タグ">
            <button class="btn small" id="builderAddPhrase">追加</button>
          </div>
          <div id="builderSelSummary" style="font-size:12px;color:var(--text-2);margin-bottom:8px;"></div>
          <div class="item-list" id="builderPhraseList" style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;max-height:360px;overflow-y:auto;margin-bottom:8px;"></div>
          <datalist id="builderSubList"></datalist>
          <div class="form-actions" style="justify-content:space-between;position:sticky;bottom:-18px;background:var(--panel);padding:10px 0 14px;margin:8px -18px -18px;padding-left:18px;padding-right:18px;border-top:1px solid var(--border);">
            <button class="btn small" id="builderClear">全タグを解除</button>
            <button class="btn small danger" id="builderDeleteAll">全カテゴリを削除</button>
          </div>
        </div>
        </div>
        </div>
        <div id="np-ja-tags-chips" class="cat-row" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;"></div>
        <textarea id="np-ja-tags" style="min-height:50px;" placeholder="選んだ日本語タグがここに並びます（直接編集も可）"></textarea>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label>日本語プロンプト</label>
        <textarea id="np-ja-sentence" style="min-height:80px;resize:none;" placeholder="上の日本語タグを見ながら、自由に日本語の文章を書いてください"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:6px;">
          <button class="btn small" id="np-ja-sentence-translate">Google翻訳で英訳 →</button>
        </div>
        <p id="translateResult" style="font-size:11.5px;color:var(--rose);margin:4px 0 0;"></p>
      </div>
      <div class="field" id="np-pos-sentence-field" style="margin-bottom:8px;">
        <div style="display:flex;align-items:center;">
          <label style="margin-bottom:0;">Positive 自由文章</label>
          <button class="btn small" id="np-pos-sentence-pin" style="margin-left:auto;">📌 この欄を固定</button>
        </div>
        <textarea id="np-pos-sentence" style="min-height:90px;margin-top:4px;" placeholder="日本語プロンプトを翻訳した英語の文章"></textarea>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px;margin-bottom:8px;">
        <div class="card-text-label">完成形プレビュー</div>
        <div id="np-preview"></div>
      </div>
    </div>
    <div id="promptList"></div>
  </div>
  </div>
</div>

  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXEN-WhRsylhWJolqfh6hKv2gL8bQVGsg",
    authDomain: "prompt-builder-c0347.firebaseapp.com",
    projectId: "prompt-builder-c0347",
    storageBucket: "prompt-builder-c0347.firebasestorage.app",
    messagingSenderId: "971373100504",
    appId: "1:971373100504:web:8a4f4f2a4225021804c6ad"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const dbFs = getFirestore(fbApp);
  const storageFb = getStorage(fbApp);
  const provider = new GoogleAuthProvider();

  window.fb = { auth, dbFs, storageFb, doc, getDoc, setDoc, ref, uploadBytes, getDownloadURL };

  window.fbSignIn = async function(){

  window.fbSignOut = function(){ signOut(auth); };

  onAuthStateChanged(auth, (user)=>{
    if(window.onFirebaseAuthChanged) window.onFirebaseAuthChanged(user);
  });
</script>

<script>
let xlsxLoadPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Excel読み込み用ライブラリの取得に失敗しました（外部リソースがブロックされている可能性があります）'));
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}

let data = { categories: [], settings: { triggerWord:'ohwx muse', qualityPrefix:'', negativeCommon:'' } };
let prompts = [];
let editingPromptId = null;
let selectedThumbFile = null;
let thumbRemoved = false;
let expandedPromptId = null;

function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------- storage layer (Firestore) ---------- */
let storageOk = true;
let currentUser = null;

async function storageGet(key){
  if(!currentUser) return null;
  try{
    const docRef = window.fb.doc(window.fb.dbFs, 'users', currentUser.uid, 'appData', key);
    const snap = await window.fb.getDoc(docRef);
    if(snap.exists() && snap.data().value !== undefined) return snap.data().value;
  }catch(e){ console.error('storageGet error', key, e); }
  return null;
}

async function storageSet(key, value){
  if(!currentUser) return false;
  try{
    const docRef = window.fb.doc(window.fb.dbFs, 'users', currentUser.uid, 'appData', key);
    await window.fb.setDoc(docRef, {value, updatedAt: Date.now()});
    hideStorageWarning();
    return true;
  }catch(e){
    console.error('storageSet error', key, e);
    showStorageWarning();
    return false;
  }
}

async function load(){
  try{
    const lib = await storageGet('library');
    if(lib){ data.categories = JSON.parse(lib); }
  }catch(e){}
  try{
    const st = await storageGet('settings');
    if(st){ data.settings = JSON.parse(st); }
  }catch(e){}
  try{
    const pr = await storageGet('prompts');
    if(pr){ prompts = JSON.parse(pr); }
  }catch(e){}
  let promptsMigrated = false;
  prompts.forEach(p=>{
    if(p.positiveSentence===undefined){
      p.positiveSentence = p.positive || '';
      p.positiveTags = p.positiveTags || '';
      delete p.positive;
      promptsMigrated = true;
    }
    if(p.japaneseSentence===undefined){
      p.japaneseSentence = p.japanese || '';
      p.japaneseTags = p.japaneseTags || '';
      delete p.japanese;
      promptsMigrated = true;
    }
  });
  if(promptsMigrated) await savePrompts();
  await loadBuilderCats();
  document.getElementById('triggerWord').value = data.settings.triggerWord||'';
  document.getElementById('qualityPrefix').value = data.settings.qualityPrefix||'';
  document.getElementById('negativeCommon').value = data.settings.negativeCommon||'';
  renderSettingsSummary();
  renderPromptList();
}

function statusLabel(s){ return s==='good'?'効果あり':(s==='needswork'?'要調整':'未検証'); }
function truncate(s, n){ return (s||'').length>n ? s.slice(0,n)+'…' : (s||''); }
function formatTimestamp(ts){
  const d = new Date(ts);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const BUILDER_CATS_DEFAULT = ['人物描写','衣装','ポーズ','仕草・動作','背景・環境','照明/雰囲気'];
let builderCats = [];
let builderSelectedCatId = null;
let editingPhraseId = null;

async function loadBuilderCats(){
  try{
    const b = await storageGet('builderCategories');
    if(b){ builderCats = JSON.parse(b); }
  }catch(e){}
  if(!builderCats || builderCats.length===0){
    builderCats = BUILDER_CATS_DEFAULT.map(name=>({id:uid(), name, phrases:[]}));
    await saveBuilderCats();
  }
  let migrated = false;
  builderCats.forEach(cat=>{
    (cat.phrases||[]).forEach(ph=>{
      if((ph.japanese===undefined || ph.japanese===null) && ph.text!==undefined){
        ph.japanese = ph.text;
        ph.english = ph.english || '';
        delete ph.text;
        migrated = true;
      }
    });
    if(!cat.subOrder){
      cat.subOrder = [];
      (cat.phrases||[]).forEach(ph=>{
        const sub = ph.sub || '';
        if(sub && !cat.subOrder.includes(sub)) cat.subOrder.push(sub);
      });
      migrated = true;
    }
  });
  if(migrated) await saveBuilderCats();
  builderSelectedCatId = builderCats[0] ? builderCats[0].id : null;
}
async function saveBuilderCats(){ await storageSet('builderCategories', JSON.stringify(builderCats)); }
function getBuilderCat(id){ return builderCats.find(c=>c.id===id); }

const CATEGORY_COLORS = ['#d97a4a','#3f7fd1','#3fa66b','#c2547e','#a67c22','#7c6fd1','#2f9aab','#b0763f','#5a8f3f','#c14f4f'];
function categoryColorFor(catId){
  const idx = builderCats.findIndex(c=>c.id===catId);
  if(idx===-1) return '#9aa0a8';
  return CATEGORY_COLORS[idx % CATEGORY_COLORS.length];
}
function findCategoryByJapanese(text){
  for(const cat of builderCats){
    if(cat.phrases.some(p=>p.japanese===text)) return cat;
  }
  return null;
}

function renderBuilderCatRow(){
  const row = document.getElementById('builderCatRow');
  row.innerHTML='';
  let dragFromIdx = null;
  builderCats.forEach((cat, idx)=>{
    const chip = document.createElement('div');
    chip.className='chip' + (cat.id===builderSelectedCatId ? ' active' : '');
    chip.draggable = true;
    chip.style.cursor = 'default';
    chip.title = 'ドラッグで並べ替え';

    const dot = document.createElement('span');
    dot.style.cssText = `display:inline-block;width:9px;height:9px;border-radius:50%;background:${categoryColorFor(cat.id)};flex-shrink:0;`;
    chip.appendChild(dot);

    const jaTagsStr = document.getElementById('np-ja-tags').value.trim();
    const appliedTexts = new Set(jaTagsStr.split(/、\s*/).map(s=>s.trim()).filter(Boolean));
    const n = cat.phrases.filter(p=>appliedTexts.has(p.japanese)).length;
    const nameSpan = document.createElement('span');
    nameSpan.textContent = cat.name + (n>0 ? ` (${n})` : '');
    nameSpan.style.cursor = 'pointer';
    nameSpan.addEventListener('click', ()=>{
      builderSelectedCatId = cat.id;
      renderBuilderCatRow();
      renderBuilderPhraseList();
    });
    chip.appendChild(nameSpan);

    const delBtn = document.createElement('button');
    delBtn.className='mini';
    delBtn.textContent='×';
    delBtn.title='このカテゴリを削除';
    delBtn.style.cssText='background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:12px;opacity:.6;';
    delBtn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const count = cat.phrases.length;
      if(!confirm(`カテゴリ「${cat.name}」を、中のフレーズ（${count}件）ごと削除しますか？`)) return;
      builderCats = builderCats.filter(c=>c.id!==cat.id);
      if(builderSelectedCatId===cat.id) builderSelectedCatId = builderCats[0] ? builderCats[0].id : null;
      await saveBuilderCats();
      renderBuilderCatRow(); renderBuilderPhraseList(); renderBuilderSelSummary();
    });
    chip.appendChild(delBtn);

    chip.addEventListener('dragstart', (ev)=>{
      dragFromIdx = idx;
      chip.style.opacity = '.4';
      chip.style.cursor = 'grabbing';
      ev.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', ()=>{ chip.style.opacity = '1'; chip.style.cursor = 'default'; });
    chip.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
    chip.addEventListener('drop', async (ev)=>{
      ev.preventDefault();
      if(dragFromIdx===null || dragFromIdx===idx) return;
      const [moved] = builderCats.splice(dragFromIdx, 1);
      builderCats.splice(idx, 0, moved);
      dragFromIdx = null;
      await saveBuilderCats();
      renderBuilderCatRow();
    });
    row.appendChild(chip);
  });
  const add = document.createElement('div');
  add.className='chip add';
  add.textContent='+ カテゴリ追加';
  add.addEventListener('click', async ()=>{
    const name = prompt('カテゴリ名');
    if(!name) return;
    builderCats.push({id:uid(), name, phrases:[]});
    await saveBuilderCats();
    builderSelectedCatId = builderCats[builderCats.length-1].id;
    renderBuilderCatRow(); renderBuilderPhraseList();
  });
  row.appendChild(add);
}

let builderDeleteSelection = {}; // catId -> [phraseId, ...]
let expandedSubs = new Set();

function renderBuilderPhraseList(){
  const area = document.getElementById('builderPhraseList');
  area.innerHTML='';
  const cat = getBuilderCat(builderSelectedCatId);
  if(!cat){ area.innerHTML='<div class="empty">カテゴリがありません</div>'; return; }
  if(cat.phrases.length===0){
    area.innerHTML='<div class="empty">まだフレーズがありません。下から追加してください。</div>';
    return;
  }
  const delSel = builderDeleteSelection[cat.id] || [];
  if(delSel.length>0){
    const bar = document.createElement('div');
    bar.style.cssText='display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);';
    const label = document.createElement('span');
    label.style.cssText='font-size:12px;color:var(--text-2);';
    label.textContent = `${delSel.length}件選択中`;
    bar.appendChild(label);
    const bulkDel = document.createElement('button');
    bulkDel.className='btn small danger';
    bulkDel.textContent='選択したフレーズを削除';
    bulkDel.addEventListener('click', async ()=>{
      if(!confirm(`選択した${delSel.length}件のフレーズを削除しますか？`)) return;
      cat.phrases = cat.phrases.filter(p=>!delSel.includes(p.id));
      builderDeleteSelection[cat.id] = [];
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    bar.appendChild(bulkDel);

    const subInput = document.createElement('input');
    subInput.type='text';
    subInput.setAttribute('list', 'subCategoryOptions');
    subInput.placeholder='サブカテゴリ名';
    subInput.style.cssText='width:140px;';
    bar.appendChild(subInput);

    const bulkSub = document.createElement('button');
    bulkSub.className='btn small primary';
    bulkSub.textContent='選択にサブカテゴリを設定';
    bulkSub.addEventListener('click', async ()=>{
      const subVal = subInput.value.trim();
      if(!subVal){ alert('サブカテゴリ名を入力してください。'); return; }
      cat.phrases.forEach(p=>{ if(delSel.includes(p.id)) p.sub = subVal; });
      builderDeleteSelection[cat.id] = [];
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    bar.appendChild(bulkSub);

    const bulkUnsub = document.createElement('button');
    bulkUnsub.className='btn small';
    bulkUnsub.textContent='未分類に戻す';
    bulkUnsub.addEventListener('click', async ()=>{
      cat.phrases.forEach(p=>{ if(delSel.includes(p.id)) p.sub = ''; });
      builderDeleteSelection[cat.id] = [];
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    bar.appendChild(bulkUnsub);

    area.appendChild(bar);
  }

  const jaTagsStr = document.getElementById('np-ja-tags').value.trim();
  const appliedTexts = new Set(jaTagsStr.split(/、\s*/).map(s=>s.trim()).filter(Boolean));
  const catColor = categoryColorFor(cat.id);

  let draggedPhraseId = null;
  let draggedSubLabel = null;

  function buildPhraseRow(ph, applied){
    const row = document.createElement('div');
    row.className='phrase-row' + (applied ? ' selected' : '');
    row.style.cursor = 'pointer';
    row.style.borderLeft = `4px solid ${catColor}`;
    if(applied) row.style.background = catColor + '1a';
    row.title = (applied ? 'タップで解除・' : 'タップで追加・') + 'ドラッグで移動';
    row.draggable = true;

    const cb = document.createElement('input');
    cb.type='checkbox';
    cb.checked = delSel.includes(ph.id);
    cb.title = '削除選択用';
    cb.addEventListener('click', (ev)=>{ ev.stopPropagation(); });
    cb.addEventListener('change', ()=>{
      const cur = builderDeleteSelection[cat.id] || [];
      if(cb.checked) builderDeleteSelection[cat.id] = [...cur, ph.id];
      else builderDeleteSelection[cat.id] = cur.filter(id=>id!==ph.id);
      renderBuilderPhraseList();
    });
    row.appendChild(cb);

    const starBtn = document.createElement('button');
    starBtn.className='icon-btn';
    starBtn.textContent = ph.favorite ? '★' : '☆';
    starBtn.title = ph.favorite ? 'お気に入り解除' : 'お気に入りに追加';
    starBtn.style.color = ph.favorite ? '#c9971f' : '';
    starBtn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      ph.favorite = !ph.favorite;
      await saveBuilderCats();
      renderBuilderPhraseList();
    });
    row.appendChild(starBtn);

    const editBtn = document.createElement('button');
    editBtn.className='icon-btn';
    editBtn.textContent='✎';
    editBtn.title='編集';
    editBtn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      editingPhraseId = ph.id;
      renderBuilderPhraseList();
    });
    row.appendChild(editBtn);
    const span = document.createElement('span');
    span.textContent = ph.english ? `${ph.japanese} — ${ph.english}` : ph.japanese;
    span.style.cursor = 'pointer';
    span.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      togglePhraseApplied(ph, applied);
    });
    row.appendChild(span);
    if(applied){
      const badge = document.createElement('span');
      badge.textContent = '追加中';
      badge.style.cssText = `font-size:10px;font-family:var(--mono);color:${catColor};border:1px solid ${catColor};border-radius:4px;padding:1px 5px;flex-shrink:0;cursor:pointer;`;
      badge.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        togglePhraseApplied(ph, applied);
      });
      row.appendChild(badge);
    }
    const del = document.createElement('button');
    del.className='del';
    del.textContent='×';
    del.title='パーツごと削除';
    del.style.marginLeft='auto';
    del.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      if(!confirm(`「${ph.japanese}」を削除しますか？`)) return;
      cat.phrases = cat.phrases.filter(p=>p.id!==ph.id);
      builderDeleteSelection[cat.id] = (builderDeleteSelection[cat.id]||[]).filter(id=>id!==ph.id);
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    row.appendChild(del);

    row.addEventListener('dragstart', (ev)=>{
      draggedPhraseId = ph.id;
      draggedSubLabel = null;
      row.style.opacity = '.4';
      ev.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', ()=>{ row.style.opacity = '1'; });
    row.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
    row.addEventListener('drop', async (ev)=>{
      ev.preventDefault();
      if(!draggedPhraseId || draggedPhraseId===ph.id) return;
      const draggedPh = cat.phrases.find(p=>p.id===draggedPhraseId);
      if(!draggedPh) return;
      draggedPh.sub = ph.sub || '';
      const fromIdx = cat.phrases.indexOf(draggedPh);
      cat.phrases.splice(fromIdx, 1);
      const toIdx = cat.phrases.indexOf(ph);
      cat.phrases.splice(toIdx, 0, draggedPh);
      draggedPhraseId = null;
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow();
    });

    return row;
  }

  const favPhrases = cat.phrases
    .map(ph=>({ph, applied: appliedTexts.has(ph.japanese)}))
    .filter(x=>x.ph.favorite)
    .sort((a,b)=> (b.applied - a.applied));
  favPhrases.forEach(({ph, applied})=>{
    if(editingPhraseId===ph.id){ area.appendChild(renderPhraseEditRow(cat, ph)); return; }
    area.appendChild(buildPhraseRow(ph, applied));
  });

  if(!cat.subOrder) cat.subOrder = [];
  cat.phrases.forEach(ph=>{
    const sub = ph.sub || '';
    if(sub && !cat.subOrder.includes(sub)) cat.subOrder.push(sub);
  });
  const existingSubs = new Set(cat.phrases.map(ph=>ph.sub||'').filter(Boolean));
  const subOrder = cat.subOrder.filter(s=>existingSubs.has(s));
  subOrder.push('');

  const optionsList = document.getElementById('subCategoryOptions');
  optionsList.innerHTML = cat.subOrder.map(s=>`<option value="${s.replace(/"/g,'&quot;')}"></option>`).join('');

  subOrder.forEach(subLabel=>{
    const sortedPhrases = cat.phrases
      .map(ph=>({ph, applied: appliedTexts.has(ph.japanese)}))
      .filter(x=> (x.ph.sub||'')===subLabel)
      .sort((a,b)=> (b.applied - a.applied));

    if(!subLabel && sortedPhrases.length>0){
      const divider = document.createElement('div');
      divider.style.cssText = `padding:6px 10px;font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--panel);border-top:3px solid var(--border-strong);letter-spacing:.03em;`;
      divider.textContent = `未分類 (${sortedPhrases.length})`;
      area.appendChild(divider);
    }

    if(subLabel){
      const isOpen = expandedSubs.has(subLabel);
      const header = document.createElement('div');
      header.className = 'sub-header';
      header.style.cssText = `display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;font-weight:600;color:${catColor};background:${catColor}14;border-top:1px solid var(--border);cursor:grab;`;
      header.draggable = true;
      header.title = 'クリックで開閉／ドラッグで順番変更';

      const arrow = document.createElement('span');
      arrow.textContent = isOpen ? '▼' : '▶';
      arrow.style.cssText = 'font-size:9px;';
      header.appendChild(arrow);

      const labelSpan = document.createElement('span');
      labelSpan.textContent = `${subLabel} (${sortedPhrases.length})`;
      header.appendChild(labelSpan);

      header.addEventListener('click', ()=>{
        if(expandedSubs.has(subLabel)) expandedSubs.delete(subLabel);
        else expandedSubs.add(subLabel);
        renderBuilderPhraseList();
      });
      header.addEventListener('dragstart', (ev)=>{
        draggedSubLabel = subLabel;
        draggedPhraseId = null;
        header.style.opacity = '.4';
        ev.dataTransfer.effectAllowed = 'move';
      });
      header.addEventListener('dragend', ()=>{ header.style.opacity = '1'; });
      header.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
      header.addEventListener('drop', async (ev)=>{
        ev.preventDefault();
        if(draggedSubLabel && draggedSubLabel!==subLabel){
          const fromIdx = cat.subOrder.indexOf(draggedSubLabel);
          const toIdx = cat.subOrder.indexOf(subLabel);
          if(fromIdx!==-1 && toIdx!==-1){
            cat.subOrder.splice(fromIdx,1);
            cat.subOrder.splice(cat.subOrder.indexOf(subLabel), 0, draggedSubLabel);
          }
          draggedSubLabel = null;
          await saveBuilderCats();
          renderBuilderPhraseList();
          return;
        }
        if(draggedPhraseId){
          const draggedPh = cat.phrases.find(p=>p.id===draggedPhraseId);
          if(draggedPh){
            draggedPh.sub = subLabel;
            draggedPhraseId = null;
            await saveBuilderCats();
            renderBuilderPhraseList(); renderBuilderCatRow();
          }
        }
      });
      area.appendChild(header);
      if(!isOpen) return;
    }

    sortedPhrases.forEach(({ph, applied})=>{
      if(editingPhraseId===ph.id){ area.appendChild(renderPhraseEditRow(cat, ph)); return; }
      area.appendChild(buildPhraseRow(ph, applied));
    });
  });
}

function renderPhraseEditRow(cat, ph){

  row.style.cssText='display:flex;flex-direction:column;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border);';
  row.innerHTML = `
    <input type="text" class="pe-sub" list="subCategoryOptions" placeholder="サブカテゴリ（任意）" value="${(ph.sub||'').replace(/"/g,'&quot;')}">
    <div class="phrase-edit-grid" style="gap:6px;">
      <input type="text" class="pe-ja" value="${ph.japanese.replace(/"/g,'&quot;')}">
      <input type="text" class="pe-en" value="${(ph.english||'').replace(/"/g,'&quot;')}">
    </div>
  `;
  const actionsRow = document.createElement('div');
  actionsRow.style.cssText='display:flex;gap:6px;justify-content:flex-end;';
  const saveBtn = document.createElement('button');
  saveBtn.className='btn small primary';
  saveBtn.textContent='保存';
  saveBtn.addEventListener('click', async ()=>{
    const ja = row.querySelector('.pe-ja').value.trim();
    const en = row.querySelector('.pe-en').value.trim();
    const sub = row.querySelector('.pe-sub').value.trim();
    if(!ja) return;
    ph.japanese = ja; ph.english = en; ph.sub = sub;
    editingPhraseId = null;
    await saveBuilderCats();
    renderBuilderPhraseList();
  });
  const cancelBtn = document.createElement('button');
  cancelBtn.className='btn small';
  cancelBtn.textContent='キャンセル';
  cancelBtn.addEventListener('click', ()=>{
    editingPhraseId = null;
    renderBuilderPhraseList();
  });
  actionsRow.appendChild(cancelBtn);
  actionsRow.appendChild(saveBtn);
  row.appendChild(actionsRow);
  return row;
}

function splitCols(line){
  if(line.includes('|')){
    const parts = line.split('|').map(c=>c.trim());
    if(parts[0]==='') parts.shift();
    if(parts.length && parts[parts.length-1]==='') parts.pop();
    return parts;
  }
  if(line.includes('\t')) return line.split('\t').map(c=>c.trim());
  return line.split(',').map(c=>c.trim());
}

function importBuilderRows(rows){
  let added = 0, catsTouched = new Set();
  rows.forEach(cols=>{
    cols = cols.map(c=>String(c==null?'':c).trim());
    if(cols.length < 2) return;
    const catName = cols[0];
    if(!catName) return;
    if(/カテゴリ/.test(catName) && /英語|日本語/.test(cols.join(''))) return;
    const japanese = cols[1] || '';
    const english = cols[2] || '';
    if(!japanese) return;
    let cat = builderCats.find(c=>c.name===catName);
    if(!cat){ cat = {id:uid(), name:catName, phrases:[]}; builderCats.push(cat); }
    if(!cat.phrases.some(p=>p.japanese===japanese)){
      cat.phrases.push({id:uid(), japanese, english});
      added++;
    }
    catsTouched.add(catName);
  });
  return {added, catCount: catsTouched.size};
}

function parseCSVQuoted(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    }else{
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ }
      else field+=c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c.length>0));
}

function findPhraseRankByText(text, field){
  for(let i=0;i<builderCats.length;i++){
    if(builderCats[i].phrases.some(ph=>ph[field]===text)) return i;
  }
  return Infinity;
}

function mergeAndSortTags(existingStr, newItems, splitRegex, joiner){
  const existingItems = existingStr.split(splitRegex).map(s=>s.trim()).filter(Boolean);
  const allItems = [...existingItems];
  newItems.forEach(item=>{ if(!allItems.includes(item)) allItems.push(item); });
  const field = joiner===', ' ? 'english' : 'japanese';
  const withRank = allItems.map((item, idx)=>({item, idx, rank: findPhraseRankByText(item, field)}));
  withRank.sort((a,b)=> a.rank-b.rank || a.idx-b.idx);
  return withRank.map(x=>x.item).join(joiner);
}

function derivedEnglishTagsFromText(jaTagsStr){
  if(!jaTagsStr) return [];
  const items = jaTagsStr.split(/、\s*/).map(s=>s.trim()).filter(Boolean);
  const enList = [];
  items.forEach(item=>{
    for(const cat of builderCats){
      const ph = cat.phrases.find(p=>p.japanese===item);
      if(ph && ph.english){ enList.push(ph.english); return; }
    }
  });
  return enList;
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w >= h){
        if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      }else{
        if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(blob) resolve(blob); else reject(new Error('画像の圧縮に失敗しました'));
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('画像の読み込みに失敗しました')); };
    img.src = url;
  });
}

async function savePromptForm(){
  const name = document.getElementById('np-name').value.trim();
  const japaneseTags = document.getElementById('np-ja-tags').value.trim();
  const japaneseSentence = document.getElementById('np-ja-sentence').value.trim();
  const positiveSentence = document.getElementById('np-pos-sentence').value.trim();
  if(!name){
    alert('保存できませんでした。名前が空欄です。');
    return;
  }
  const savedId = editingPromptId || uid();
  let thumbnailUrl = editingPromptId ? (prompts.find(x=>x.id===editingPromptId)||{}).thumbnailUrl : undefined;

  if(selectedThumbFile){
    const statusEl = document.getElementById('np-thumb-status');
    statusEl.textContent = '画像を圧縮しています…';
    try{
      const compressed = await compressImage(selectedThumbFile, 640, 0.75);
      statusEl.textContent = '画像をアップロード中…';
      const path = `users/${currentUser.uid}/thumbnails/${savedId}.jpg`;
      const storageRef = window.fb.ref(window.fb.storageFb, path);
      await window.fb.uploadBytes(storageRef, compressed);
      thumbnailUrl = await window.fb.getDownloadURL(storageRef);
      statusEl.textContent = '';
    }catch(e){
      statusEl.textContent = '画像のアップロードに失敗しました: ' + (e && e.message ? e.message : String(e));
      alert('サムネイル画像のアップロードに失敗しました。プロンプト自体は保存を続行します。');
    }
  }else if(thumbRemoved){
    thumbnailUrl = null;
  }

  if(editingPromptId){
    const p = prompts.find(x=>x.id===editingPromptId);
    if(p){ p.name=name; p.japaneseTags=japaneseTags; p.japaneseSentence=japaneseSentence; p.positiveSentence=positiveSentence; p.thumbnailUrl=thumbnailUrl||null; p.updatedAt=Date.now(); }
  }else{
    const np = {id:savedId, name, japaneseTags, japaneseSentence, positiveSentence, thumbnailUrl:thumbnailUrl||null, status:'untested', createdAt:Date.now(), updatedAt:Date.now(), parentId:null};
    prompts.unshift(np);
  }
  await savePrompts();
  document.getElementById('newPromptForm').classList.remove('open');
  editingPromptId = null;
  expandedPromptId = savedId;
  renderPromptList();
}

        jaTagLabel.className='card-text-label';
        jaTagLabel.textContent='日本語タグ';
        card.appendChild(jaTagLabel);
        const jaTagText = document.createElement('div');
        jaTagText.className='card-text';
        jaTagText.style.color='var(--text-2)';
        jaTagText.textContent = p.japaneseTags;
        card.appendChild(jaTagText);
      }
      if(p.japaneseSentence){
        const jaLabel = document.createElement('div');
        jaLabel.className='card-text-label';
        jaLabel.textContent='日本語プロンプト';
        card.appendChild(jaLabel);
        const jaText = document.createElement('div');
        jaText.className='card-text';
        jaText.style.color='var(--text-2)';
        jaText.textContent = p.japaneseSentence;
        card.appendChild(jaText);
      }

      const posLabel = document.createElement('div');
      posLabel.className='card-text-label';
      posLabel.textContent='Positive（完成形：trigger word・品質タグ込み）';
      card.appendChild(posLabel);
      const posText = document.createElement('div');
      posText.className='card-text';
      posText.textContent = finalPos || '（Positive自由文章は未入力）';
      card.appendChild(posText);
    }

    area.appendChild(card);
  });
}

function openEditForm(p){
  editingPromptId = p.id;
  document.getElementById('np-name').value = p.name;
  document.getElementById('np-ja-tags').value = p.japaneseTags||'';
  document.getElementById('np-ja-sentence').value = p.japaneseSentence||'';
  document.getElementById('np-pos-sentence').value = p.positiveSentence||'';
  loadThumbField(p.thumbnailUrl);
  document.getElementById('newPromptForm').classList.add('open');
  renderAllTagChips();
  renderNpPreview();
  document.getElementById('newPromptForm').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- backup export / import ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const backup = {
    exportedAt: new Date().toISOString(),
    categories: data.categories,
    builderCategories: builderCats,
    settings: data.settings,
    prompts: prompts
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const pad = n=>String(n).padStart(2,'0');
  const d = new Date();
  a.href = url;
  a.download = `prompt-builder-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBackupFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const resultEl = document.getElementById('backupResult');
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.categories && !backup.prompts) throw new Error('バックアップファイルの形式が正しくありません');
    const mode = confirm('OK＝今のデータを上書きして復元／キャンセル＝今のデータに追加でマージ');
    if(mode){
      data.categories = backup.categories || data.categories;
      builderCats = backup.builderCategories || builderCats;
      data.settings = backup.settings || data.settings;
      prompts = backup.prompts || prompts;
    }else{
      (backup.builderCategories||[]).forEach(bc=>{
        let cat = builderCats.find(c=>c.name===bc.name);
        if(!cat){ cat = {id:uid(), name:bc.name, phrases:[]}; builderCats.push(cat); }
        (bc.phrases||[]).forEach(bp=>{
          if(!cat.phrases.some(p=>p.japanese===bp.japanese)) cat.phrases.push({id:uid(), japanese:bp.japanese, english:bp.english||''});
        });
      });
      (backup.prompts||[]).forEach(bp=>{
        if(!prompts.some(p=>p.name===bp.name && p.positiveSentence===bp.positiveSentence)){
          prompts.push({...bp, id:uid()});
        }
      });
    }
    await storageSet('library', JSON.stringify(data.categories));
    await saveBuilderCats();
    await saveSettings(); await savePrompts();
    document.getElementById('triggerWord').value = data.settings.triggerWord||'';
    document.getElementById('qualityPrefix').value = data.settings.qualityPrefix||'';
    document.getElementById('negativeCommon').value = data.settings.negativeCommon||'';
    builderSelectedCatId = builderCats[0] ? builderCats[0].id : null;
    renderSettingsSummary();
    renderPromptList();
    resultEl.textContent = '復元が完了しました。';
  }catch(err){
    resultEl.textContent = '読み込みに失敗しました: ' + (err && err.message ? err.message : String(err));
  }
  e.target.value = '';
});

</script>
