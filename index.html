<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prompt Builder</title>
<style>
  :root{
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --border: #e2e5ea;
    --border-strong: #c9ced6;
    --text: #1a1d21;
    --text-2: #5b6270;
    --text-3: #8b919c;
    --teal: #0f8a7e;
    --teal-dim: #e3f5f2;
    --amber: #b06a00;
    --amber-dim: #fdf1de;
    --green: #157a3d;
    --green-dim: #e6f6ec;
    --rose: #c0362c;
    --rose-dim: #fbeae8;
    --mono: 'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.55;}
  .app{max-width:900px;margin:0 auto;padding:0 20px 80px;}
  h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;padding:16px 0 12px;}
  input[type=text],textarea,select{
    width:100%;background:var(--panel);border:1px solid var(--border-strong);
    color:var(--text);border-radius:6px;padding:7px 9px;font-family:var(--sans);font-size:13px;
  }
  textarea{resize:vertical;min-height:34px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);}
  .btn{
    background:var(--panel);border:1px solid var(--border-strong);color:var(--text);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn.primary:hover{opacity:.9;color:#fff;}
  .btn.orange{background:#d97706;border-color:#d97706;color:#fff;}
  .btn.orange:hover{opacity:.9;color:#fff;}
  .btn.danger{border-color:var(--rose);color:var(--rose);}

  #stickyHeader{background:var(--bg);padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .field.pinned{position:sticky;top:8px;z-index:40;background:var(--bg);padding-top:8px;padding-bottom:8px;box-shadow:0 4px 14px rgba(20,25,30,0.1);}
  #builderPanel.open{position:fixed;inset:0;z-index:1000;background:rgba(20,25,30,0.45);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;border:none;border-radius:0;max-width:none;margin:0;}
  #builderPanelInner{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,30,0.25);width:560px;flex-shrink:0;padding:18px;max-height:90vh;overflow-y:auto;}
  #builderSelectedPanel{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,30,0.25);width:150px;flex-shrink:0;padding:12px 10px;max-height:90vh;overflow-y:auto;}
  #builderCatListPanel{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,30,0.25);width:200px;flex-shrink:0;padding:12px 0;max-height:90vh;overflow-y:auto;}
  #builderCatListPanel > div:first-child{padding:0 10px;}
  #builderAddPhraseModal.open{position:fixed;inset:0;z-index:1100;background:rgba(20,25,30,0.5);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:6vh 16px;border:none;border-radius:0;max-width:none;margin:0;}
  #builderAddPhraseModalInner{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,30,0.3);max-width:480px;width:100%;padding:18px;max-height:88vh;overflow-y:auto;}
  .selected-tag-item{display:flex;flex-direction:column;margin-bottom:6px;background:var(--panel-2);border-radius:6px;font-size:12px;overflow:hidden;line-height:1.4;}
  .sel-edit{display:block;width:100%;height:11px;padding:0;border:none;border-bottom:1px solid #a9b1bc;background:linear-gradient(#fcfdfd,#dce1e7);box-shadow:inset 0 1px 0 #ffffff;cursor:pointer;}
  .sel-edit:hover{background:linear-gradient(#3db8ab,#0f8a7e);border-bottom-color:#0a6a61;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
  .sel-edit:active{background:#0a6a61;box-shadow:inset 0 1px 3px rgba(0,0,0,.35);}
  .sel-text{padding:3px 8px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .sel-text:hover{background:var(--rose-dim);color:var(--rose);}
  .settings-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);padding:4px 0;flex-wrap:wrap;}
  .settings-line b{color:var(--text-2);font-weight:600;}
  .settings-panel{display:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:6px 0;}
  .settings-panel.open{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .field label{display:block;font-size:10.5px;color:var(--text-3);margin-bottom:4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}

  .toprow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}

  #contentArea{padding-top:14px;}
  .panel{background:var(--panel);border:1px dashed var(--border-strong);border-radius:8px;padding:12px;margin-bottom:14px;display:none;}
  .panel.open{display:block;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .template-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .card-name{font-weight:600;font-size:14.5px;flex:1;}
  .card-meta{font-size:10.5px;color:var(--text-3);font-family:var(--mono);}
  .badge{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.untested{background:var(--panel-2);color:var(--text-3);}
  .badge.good{background:var(--green-dim);color:var(--green);}
  .badge.needswork{background:var(--amber-dim);color:var(--amber);}
  .btn.status-untested{background:var(--panel-2);color:var(--text-3);border-color:var(--border-strong);}
  .btn.status-good{background:var(--green-dim);color:var(--green);border-color:var(--green);}
  .btn.status-needswork{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
  .card-text-label{font-size:10.5px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px;}
  .org-selbar{position:sticky;top:0;z-index:30;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;background:var(--teal-dim);border:1px solid var(--teal);border-radius:8px;}
  .org-btn.org-btn-on{color:var(--teal);font-weight:600;}
  .org-cb{flex-shrink:0;}
  .parts-panel{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel-2);}
  .parts-title{font-size:11px;color:var(--text-3);margin-bottom:6px;}
  .parts-block{margin-bottom:8px;}
  .parts-block:last-child{margin-bottom:0;}
  .parts-tagname{font-size:12px;font-weight:600;margin-bottom:4px;}
  .parts-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .part-chip{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;text-align:left;font-family:var(--sans);}
  .part-chip.on{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);}
  .part-chip.off{opacity:.55;text-decoration:line-through;}
  .news-day{font-size:12px;font-weight:600;color:var(--text-2);margin:14px 0 6px;}
  .news-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);margin-bottom:6px;cursor:pointer;}
  .news-row:hover{border-color:var(--teal);}
  .news-badge{font-size:10px;border-radius:4px;padding:2px 7px;font-family:var(--mono);flex-shrink:0;}
  .news-badge.prompt{background:var(--teal-dim);color:var(--teal);}
  .news-badge.tag{background:var(--amber-dim);color:var(--amber);}
  .news-title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .news-sub{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .news-time{font-size:11px;color:var(--text-3);flex-shrink:0;font-family:var(--mono);}
  .org-flash{animation:orgflash 1.8s ease-out;}
  @keyframes orgflash{0%{background:#ffe27a;box-shadow:0 0 0 3px #ffd23f;}100%{background:transparent;box-shadow:0 0 0 0 transparent;}}
  .org-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .org-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
  .org-hint{font-size:11.5px;color:var(--text-3);margin:0 0 10px;line-height:1.5;}
  .org-box{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--panel);}
  .org-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border);font-size:13px;background:var(--panel);user-select:none;cursor:default;}
  .org-row input{user-select:text;}
  .org-row.org-drop-before{box-shadow:inset 0 3px 0 var(--teal);}
  .org-row.org-drop-after{box-shadow:inset 0 -3px 0 var(--teal);}
  .org-row.org-drop-inside{outline:2px solid var(--teal);outline-offset:-2px;}
  .org-handle{cursor:grab;color:var(--text-3);font-size:13px;flex-shrink:0;}
  .org-btn{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;padding:2px 6px;border-radius:4px;flex-shrink:0;}
  .org-btn:hover{color:var(--teal);background:var(--panel-2);}
  .org-btn.org-del:hover{color:var(--rose);}
  .org-count{font-size:11px;color:var(--text-3);font-weight:400;}
  .org-empty{padding:10px 14px;font-size:12px;color:var(--text-3);}
  .org-thumb{width:28px;height:28px;object-fit:cover;border-radius:5px;flex-shrink:0;background:var(--panel-2);display:inline-block;}
  .org-name-input{flex:1;min-width:0;}
  .prompt-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(90px, 1fr));gap:8px;margin-bottom:12px;}
  .prompt-block{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;}
  .prompt-block:hover{border-color:var(--teal);}
  .prompt-block-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--panel-2);}
  .prompt-block-thumb-empty{display:flex;align-items:center;justify-content:center;}
  .prompt-block-name{font-size:12.5px;font-weight:600;padding:8px 8px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;line-height:1.3;}
  .prompt-block-actions{display:flex;gap:6px;padding:0 8px 8px;}
  .prompt-block-actions .btn{flex:1;padding:4px 6px;font-size:11px;}
  .card-text{font-size:13px;background:var(--panel-2);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;}
  .card-text.neg{color:var(--rose);}
  .card-note{font-size:12.5px;color:var(--text-2);font-style:italic;margin-top:8px;}
  .card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:14px;border:1px solid var(--border-strong);
    background:var(--panel);font-size:12.5px;cursor:pointer;color:var(--text-2);
  }
  .chip.active{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);font-weight:600;}
  .chip.add{border-style:dashed;color:var(--text-3);}
  .cat-list-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;color:var(--text-2);}
  .cat-list-item:hover{background:var(--panel-2);}
  .cat-list-item.active{background:var(--teal-dim);color:var(--teal);font-weight:600;}
  .cat-list-item.add{color:var(--text-3);border-style:dashed;border-bottom-style:dashed;}
  .tag-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 6px 3px 10px;border-radius:12px;background:var(--teal-dim);color:var(--teal);font-size:12px;}
  .tag-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:12px;padding:0;line-height:1;opacity:.7;}
  .tag-chip button:hover{opacity:1;}
  .phrase-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;user-select:none;}
  .sub-header{user-select:none;}
  .phrase-row:last-child{border-bottom:none;}
  .phrase-row:hover{background:var(--panel);}
  .phrase-row.selected{background:var(--teal-dim);color:var(--teal);font-weight:600;}
  .phrase-row .icon-btn{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:12px;}
  .phrase-row .icon-btn:hover{color:var(--teal);}
  .phrase-row .del{margin-left:auto;background:none;border:none;color:var(--text-3);cursor:pointer;font-size:12px;}
  .phrase-row .del:hover{color:var(--rose);}
  .empty{color:var(--text-3);font-size:13px;padding:24px;text-align:center;}
  .quick-add-grid{display:grid;grid-template-columns:1fr 1fr auto;}
  .phrase-edit-grid{display:grid;grid-template-columns:1fr 1fr auto auto;}

  @media (max-width: 600px){
    .app{padding:0 12px 60px;}
    h1{font-size:16px;padding:12px 0 10px;}
    .btn{padding:8px 12px;font-size:13px;}
    .btn.small{padding:7px 10px;font-size:12px;}
    input[type=text],textarea,select{font-size:16px;padding:9px 10px;}
    .settings-line{font-size:11px;}
    .settings-panel.open{grid-template-columns:1fr;}
    .toprow{gap:6px;}
    .toprow input[type=text]{max-width:none !important;width:100%;}
    #newPromptBtn{margin-left:0 !important;width:100%;}
    .quick-add-grid{grid-template-columns:1fr;}
    .quick-add-grid button{width:100%;}
    .phrase-edit-grid{grid-template-columns:1fr;}
    .phrase-row{flex-wrap:wrap;padding:9px 10px;}
    .phrase-row input[type=checkbox]{width:18px;height:18px;}
    #builderPopupRow{flex-direction:column;}
    #builderSelectedPanel{width:100%;max-height:110px;}
    .card-name{font-size:14px;}
    .card-actions .btn{flex:1;min-width:calc(50% - 4px);}
    .form-actions{flex-wrap:wrap;}
    .form-actions .btn{flex:1;}
    .cat-row .chip{font-size:13px;padding:6px 10px;}
    .org-row{flex-wrap:wrap;}
    .org-selbar select{max-width:100% !important;}
    .np-name-row{flex-direction:column;align-items:stretch !important;}
    .np-name-row > div{flex:none !important;width:100%;}
    .icon-btn{font-size:16px;padding:4px 6px;}
    .del{font-size:16px;padding:4px 6px;}
    .sub-header{padding:9px 10px !important;}
    #builderPanel.open{padding:0 !important;align-items:stretch !important;}
    #builderPopupRow{height:100%;}
    #builderPanelInner{max-height:none;height:100%;border-radius:0;}
    #builderSelectedPanel{max-height:96px;border-radius:0;}
    #builderCatListPanel{width:100%;max-height:96px;border-radius:0;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="loginGate" style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;">
    <h1 style="padding:0;">プロンプトビルダー</h1>
    <p style="color:var(--text-2);font-size:13.5px;max-width:320px;">Googleアカウントでログインすると、PCとスマホでデータが同期されます。</p>
    <button class="btn primary" id="googleSignInBtn" style="padding:10px 20px;font-size:14px;">Googleでログイン</button>
    <p id="loginError" style="color:var(--rose);font-size:12.5px;"></p>
  </div>
  <div id="appContent" style="display:none;">
  <h1>プロンプトビルダー</h1>
  <div id="storageWarning" style="display:none;background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;"></div>

  <div id="stickyHeader">
    <div class="settings-line">
      <span><b>TRIGGER</b> <span id="settingsSummary1"></span></span>
      <span>・</span>
      <span><b>品質タグ</b> <span id="settingsSummary2"></span></span>
      <span>・</span>
      <span><b>NEGATIVE</b> <span id="settingsSummary3"></span></span>
      <span id="userEmailLabel" style="font-size:11px;color:var(--text-3);margin-left:10px;"></span>
      <button class="btn small" id="signOutBtn" style="margin-left:6px;">ログアウト</button>
      <button class="btn small" id="settingsToggle" style="margin-left:auto;">固定設定を編集</button>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <div class="field">
        <label>Trigger word</label>
        <input type="text" id="triggerWord" placeholder="ohwx muse">
      </div>
      <div class="field">
        <label>品質タグ（参考用）</label>
        <input type="text" id="qualityPrefix" placeholder="ohwx_muse_lora, 1girl, ...">
      </div>
      <div class="field">
        <label>共通ネガティブ（参考用）</label>
        <input type="text" id="negativeCommon" placeholder="overexposed, blown highlights">
      </div>
    </div>

    <div class="toprow" id="listToprow">
      <input type="text" id="promptSearch" placeholder="名前・本文・メモで検索…" style="max-width:280px;">
      <button class="btn primary" id="newPromptBtn" style="margin-left:auto;">+ 新しいプロンプト</button>
      <button class="btn small" id="newsBtn">🆕 新着</button>
      <button class="btn small" id="organizerBtn">🗂 整理</button>
      <button class="btn small" id="exportBtn">バックアップ書き出し</button>
      <label class="btn small" for="importBackupFile" style="cursor:pointer;">バックアップ読み込み
        <input type="file" id="importBackupFile" accept=".json" style="display:none;">
      </label>
    </div>
    <span id="backupResult" style="font-size:11.5px;color:var(--teal);"></span>
  </div>

  <div id="contentArea">
    <div class="panel" id="newPromptForm">
      <div class="field np-name-row" style="margin-bottom:8px;display:flex;gap:8px;align-items:flex-end;">
        <div style="flex:3;">
          <label>名前</label>
          <input type="text" id="np-name" placeholder="例：丘の上セーラー服・笑顔">
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div style="display:flex;gap:6px;">
            <button class="btn small" id="np-name-cancel" title="キャンセル" style="flex:1;">✕</button>
            <button class="btn small orange" id="np-name-save" title="保存" style="flex:1;">保存</button>
          </div>
          <button class="btn small primary" id="np-name-copy-pos" style="width:100%;">Positiveをコピー</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label>カテゴリ（任意）</label>
        <input type="text" id="np-category" list="promptCategoryOptions" placeholder="例：水着 / セーラー服 など">
        <datalist id="promptCategoryOptions"></datalist>
      </div>
      <div class="field" id="np-meta-row" style="margin-bottom:8px;display:none;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <button class="btn small" id="np-status-btn"></button>
          <span id="np-meta-timestamp" style="font-size:11.5px;color:var(--text-3);"></span>
          <button class="btn small" id="np-clone-btn" style="margin-left:auto;">複製して編集</button>
          <button class="btn small danger" id="np-delete-btn">削除</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label>サムネイル画像（任意）</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <img id="np-thumb-preview" src="" style="display:none;width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">
          <input type="file" id="np-thumb-file" accept="image/*">
          <button class="btn small" id="np-thumb-remove" style="display:none;">画像を削除</button>
        </div>
        <p id="np-thumb-status" style="font-size:11.5px;color:var(--text-3);margin:4px 0 0;"></p>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label>日本語タグ</label>
        <div class="template-row">
          <button class="btn small" id="builderToggle">ビルダーで組み立てる</button>
        </div>
        <div class="panel" id="builderPanel">
        <div id="builderPopupRow" style="display:flex;gap:12px;align-items:stretch;">
        <div id="builderSelectedPanel"></div>
        <div id="builderCatListPanel">
          <div style="font-weight:600;font-size:12px;margin-bottom:8px;">カテゴリ</div>
          <div id="builderCatRow"></div>
        </div>
        <div id="builderPanelInner">
          <div style="display:flex;align-items:center;margin-bottom:12px;">

/* ---------- storage layer (Firestore) ---------- */
let storageOk = true;
let currentUser = null;

async function storageGet(key){
  if(!currentUser) return null;
  try{
    const docRef = window.fb.doc(window.fb.dbFs, 'users', currentUser.uid, 'appData', key);
    const snap = await window.fb.getDoc(docRef);
    if(snap.exists() && snap.data().value !== undefined) return snap.data().value;
  }catch(e){ console.error('storageGet error', key, e); }
  return null;
}

async function storageSet(key, value){
  if(!currentUser) return false;
  try{
    const docRef = window.fb.doc(window.fb.dbFs, 'users', currentUser.uid, 'appData', key);
    await window.fb.setDoc(docRef, {value, updatedAt: Date.now()});
    hideStorageWarning();
    return true;
  }catch(e){
    console.error('storageSet error', key, e);
    showStorageWarning();
    return false;
  }
}

function showStorageWarning(){
  storageOk = false;
  const el = document.getElementById('storageWarning');
  el.style.display = 'block';
  el.textContent = '⚠️ 保存に失敗しました。通信状況をご確認のうえ、こまめに「バックアップ書き出し」でファイルにも保存してください。';

const BUILDER_CATS_DEFAULT = ['人物描写','衣装','ポーズ','仕草・動作','背景・環境','照明/雰囲気'];
let builderCats = [];

async function loadBuilderCats(){
  try{
    const b = await storageGet('builderCategories');
    if(b){ builderCats = JSON.parse(b); }
  }catch(e){}
  if(!builderCats || builderCats.length===0){
    builderCats = BUILDER_CATS_DEFAULT.map(name=>({id:uid(), name, phrases:[], groups:[]}));
    await saveBuilderCats();
  }
  const migrated = normalizeBuilderCats();
  if(migrated) await saveBuilderCats();
  builderSelectedCatId = builderCats[0] ? builderCats[0].id : null;
}

/* 旧形式（sub文字列）→ 階層グループ（groups/groupId）へ移行。何度呼んでも安全 */
function normalizeBuilderCats(){
  let changed = false;
  builderCats.forEach(cat=>{
    if(!Array.isArray(cat.phrases)){ cat.phrases = []; changed = true; }
    cat.phrases.forEach(ph=>{
      if((ph.japanese===undefined || ph.japanese===null) && ph.text!==undefined){
        ph.japanese = ph.text;
        ph.english = ph.english || '';
        delete ph.text;
        changed = true;
      }
    });
    if(!Array.isArray(cat.groups)){
      cat.groups = [];
      changed = true;
      const labels = [...(cat.subOrder||[])];
      cat.phrases.forEach(ph=>{
        const s = ph.sub || '';
        if(s && !labels.includes(s)) labels.push(s);
      });
      labels.forEach(l=>{
        const g = {id:uid(), name:l, children:[]};
        cat.groups.push(g);
        cat.phrases.forEach(ph=>{ if((ph.sub||'')===l) ph.groupId = g.id; });
      });
    }
    if(typeof cat.partToggle!=='boolean'){ cat.partToggle = (cat.name==='衣装'); changed = true; }
    cat.phrases.forEach(ph=>{ if('sub' in ph){ delete ph.sub; changed = true; } });
    if('subOrder' in cat){ delete cat.subOrder; changed = true; }
    (function fix(arr){
      arr.forEach(g=>{
        if(!Array.isArray(g.children)){ g.children = []; changed = true; }
        fix(g.children);
      });
    })(cat.groups);
  });
  return changed;
}

/* ---------- サブカテゴリ（階層）ヘルパー ---------- */
function catGroups(cat){ if(!cat.groups) cat.groups = []; return cat.groups; }

function findGroupLoc(cat, id, arr, parent){
  arr = arr || catGroups(cat);
  for(let i=0;i<arr.length;i++){
    if(arr[i].id===id) return {node:arr[i], arr, index:i, parent:parent||null};
    if(!arr[i].children) arr[i].children = [];
    const r = findGroupLoc(cat, id, arr[i].children, arr[i]);
    if(r) return r;
  }
  return null;
}
function flattenGroups(cat){
  const out = [];
  (function walk(arr, depth, names){
    arr.forEach(g=>{
      const nm = [...names, g.name];
      out.push({node:g, depth, label:nm.join(' › ')});
      walk(g.children||[], depth+1, nm);
    });
  })(catGroups(cat), 0, []);
  return out;
}
function groupAncestorIds(cat, id){
  let found = [];
  (function walk(arr, trail){
    for(const g of arr){
      const t = [...trail, g.id];
      if(g.id===id){ found = t; return true; }
      if(walk(g.children||[], t)) return true;
    }
    return false;
  })(catGroups(cat), []);
  return found;
}
function subtreeIds(node){
  const ids = [node.id];
  (node.children||[]).forEach(c=>ids.push(...subtreeIds(c)));
  return ids;
}
function groupSelectOptions(cat, selectedId, noneLabel){
  let html = `<option value="">${escHtml(noneLabel)}</option>`;
  flattenGroups(cat).forEach(({node, depth})=>{
    html += `<option value="${escHtml(node.id)}"${node.id===selectedId?' selected':''}>${'　'.repeat(depth)}${escHtml(node.name)}</option>`;
  });
  return html;
}

function renderBuilderPhraseList(){
  const area = document.getElementById('builderPhraseList');
  area.innerHTML='';
  const cat = getBuilderCat(builderSelectedCatId);
  if(!cat){ area.innerHTML='<div class="empty">カテゴリがありません</div>'; return; }
  if(cat.phrases.length===0 && catGroups(cat).length===0){
    area.innerHTML='<div class="empty">まだフレーズがありません。上の「＋ 新しいフレーズを登録」から追加してください。</div>';
    return;
  }
  const delSel = builderDeleteSelection[cat.id] || [];
  if(delSel.length>0){
    const bar = document.createElement('div');
    bar.style.cssText='display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);';
    const label = document.createElement('span');
    label.style.cssText='font-size:12px;color:var(--text-2);';
    label.textContent = `${delSel.length}件選択中`;
    bar.appendChild(label);
    const bulkDel = document.createElement('button');
    bulkDel.className='btn small danger';
    bulkDel.textContent='選択したフレーズを削除';
    bulkDel.addEventListener('click', async ()=>{
      if(!confirm(`選択した${delSel.length}件のフレーズを削除しますか？`)) return;
      cat.phrases = cat.phrases.filter(p=>!delSel.includes(p.id));
      builderDeleteSelection[cat.id] = [];
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    bar.appendChild(bulkDel);

    const groupSel = document.createElement('select');
    groupSel.innerHTML = groupSelectOptions(cat, '', 'サブカテゴリを選択');
    groupSel.style.cssText='width:auto;max-width:170px;';
    bar.appendChild(groupSel);

    const bulkSub = document.createElement('button');
    bulkSub.className='btn small primary';
    bulkSub.textContent='選択をこのサブカテゴリへ';
    bulkSub.addEventListener('click', async ()=>{
      const gid = groupSel.value;
      if(!gid){ alert('サブカテゴリを選択してください。'); return; }
      cat.phrases.forEach(p=>{ if(delSel.includes(p.id)) p.groupId = gid; });
      builderDeleteSelection[cat.id] = [];
      groupAncestorIds(cat, gid).forEach(id=>expandedSubs.add(id));
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    bar.appendChild(bulkSub);

    const bulkUnsub = document.createElement('button');
    bulkUnsub.className='btn small';
    bulkUnsub.textContent='未分類に戻す';
    bulkUnsub.addEventListener('click', async ()=>{
      cat.phrases.forEach(p=>{ if(delSel.includes(p.id)) delete p.groupId; });
      builderDeleteSelection[cat.id] = [];
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    bar.appendChild(bulkUnsub);

    area.appendChild(bar);
  }

  const jaTagsStr = document.getElementById('np-ja-tags').value.trim();
  const appliedTexts = new Set(jaTagsStr.split(/、\s*/).map(s=>s.trim()).filter(Boolean));
  const catColor = categoryColorFor(cat.id);

  let draggedPhraseId = null;
  let draggedGroupId = null;

  function buildPhraseRow(ph, applied, depth){
    const row = document.createElement('div');
    row.className='phrase-row' + (applied ? ' selected' : '');
    row.style.cursor = 'pointer';
    row.style.borderLeft = `4px solid ${catColor}`;
    row.style.background = applied ? (catColor + '33') : (catColor + '14');
    if(depth) row.style.marginLeft = (depth*14) + 'px';
    row.title = (applied ? 'タップで解除・' : 'タップで追加・') + 'ドラッグで移動';
    row.draggable = true;

    const iconGroup = document.createElement('span');
    iconGroup.style.cssText = 'display:flex;align-items:center;gap:4px;';
    iconGroup.addEventListener('click', (ev)=>{ ev.stopPropagation(); });

    const cb = document.createElement('input');
    cb.type='checkbox';
    cb.checked = delSel.includes(ph.id);
    cb.title = '選択用（一括削除・サブカテゴリ設定）';
    cb.addEventListener('change', ()=>{
      const cur = builderDeleteSelection[cat.id] || [];
      if(cb.checked) builderDeleteSelection[cat.id] = [...cur, ph.id];
      else builderDeleteSelection[cat.id] = cur.filter(id=>id!==ph.id);
      renderBuilderPhraseList();
    });
    iconGroup.appendChild(cb);

    const starBtn = document.createElement('button');
    starBtn.className='icon-btn';
    starBtn.textContent = ph.favorite ? '★' : '☆';
    starBtn.title = ph.favorite ? 'お気に入り解除' : 'お気に入りに追加';
    starBtn.style.color = ph.favorite ? '#c9971f' : '';
    starBtn.addEventListener('click', async ()=>{
      ph.favorite = !ph.favorite;
      await saveBuilderCats();
      renderBuilderPhraseList();
    });
    iconGroup.appendChild(starBtn);

    const editBtn = document.createElement('button');
    editBtn.className='icon-btn';
    editBtn.textContent='✎';
    editBtn.title='編集';
    editBtn.addEventListener('click', ()=>{
      editingPhraseId = ph.id;
      renderBuilderPhraseList();
    });
    iconGroup.appendChild(editBtn);

    row.appendChild(iconGroup);

    const span = document.createElement('span');
    span.textContent = ph.japanese;
    if(ph.english) span.title = ph.english;
    row.appendChild(span);
    if(applied){
      const badge = document.createElement('span');
      badge.textContent = '追加中';
      badge.style.cssText = `font-size:10px;font-family:var(--mono);color:${catColor};border:1px solid ${catColor};border-radius:4px;padding:1px 5px;flex-shrink:0;`;
      row.appendChild(badge);
    }
    const del = document.createElement('button');
    del.className='del';
    del.textContent='×';
    del.title='パーツごと削除';
    del.style.marginLeft='auto';
    del.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      if(!confirm(`「${ph.japanese}」を削除しますか？`)) return;
      cat.phrases = cat.phrases.filter(p=>p.id!==ph.id);
      builderDeleteSelection[cat.id] = (builderDeleteSelection[cat.id]||[]).filter(id=>id!==ph.id);
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow(); renderBuilderSelSummary();
    });
    row.appendChild(del);

    row.addEventListener('dragstart', (ev)=>{
      draggedPhraseId = ph.id;
      draggedGroupId = null;
      row.style.opacity = '.4';
      ev.dataTransfer.effectAllowed = 'move';
      try{ ev.dataTransfer.setData('text/plain','phrase'); }catch(e){}
    });
    row.addEventListener('dragend', ()=>{ row.style.opacity = '1'; });
    row.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
    row.addEventListener('drop', async (ev)=>{
      ev.preventDefault();
      if(!draggedPhraseId || draggedPhraseId===ph.id) return;
      const draggedPh = cat.phrases.find(p=>p.id===draggedPhraseId);
      if(!draggedPh) return;
      if(ph.groupId) draggedPh.groupId = ph.groupId; else delete draggedPh.groupId;
      const fromIdx = cat.phrases.indexOf(draggedPh);
      cat.phrases.splice(fromIdx, 1);
      const toIdx = cat.phrases.indexOf(ph);
      cat.phrases.splice(toIdx, 0, draggedPh);
      draggedPhraseId = null;
      await saveBuilderCats();
      renderBuilderPhraseList(); renderBuilderCatRow();
    });
    row.addEventListener('click', ()=>{
      togglePhraseApplied(ph, applied);
    });

    return row;
  }

  function appendPhraseRows(list, depth){
    list.forEach(({ph, applied})=>{
      if(editingPhraseId===ph.id){ area.appendChild(renderPhraseEditRow(cat, ph)); return; }
      area.appendChild(buildPhraseRow(ph, applied, depth));
    });
  }
  function sortPhrases(arr){
    return arr
      .map(ph=>({ph, applied: appliedTexts.has(ph.japanese)}))
      .sort((a,b)=> (b.applied - a.applied) || ((b.ph.favorite?1:0) - (a.ph.favorite?1:0)));
  }

  /* ★ お気に入り */
  const favPhrases = cat.phrases
    .map(ph=>({ph, applied: appliedTexts.has(ph.japanese)}))
    .filter(x=>x.ph.favorite)
    .sort((a,b)=> (b.applied - a.applied));
  if(favPhrases.length>0){
    const favOpen = expandedSubs.has('__fav__');
    const favHeader = document.createElement('div');
    favHeader.className = 'sub-header';
    favHeader.style.cssText = 'display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;font-weight:600;color:#c9971f;background:#c9971f14;cursor:pointer;';
    const favArrow = document.createElement('span');
    favArrow.textContent = favOpen ? '▼' : '▶';
    favArrow.style.cssText = 'font-size:9px;';
    favHeader.appendChild(favArrow);
    const favLabel = document.createElement('span');
    favLabel.textContent = `★ お気に入り (${favPhrases.length})`;
    favHeader.appendChild(favLabel);
    favHeader.addEventListener('click', ()=>{
      if(expandedSubs.has('__fav__')) expandedSubs.delete('__fav__');
      else expandedSubs.add('__fav__');
      renderBuilderPhraseList();
    });
    area.appendChild(favHeader);
    if(favOpen) appendPhraseRows(favPhrases, 0);
  }

  /* サブカテゴリ（階層） */
  function renderGroups(arr, depth){
    arr.forEach(node=>{
      const ids = subtreeIds(node);
      const total = cat.phrases.filter(p=>ids.includes(p.groupId)).length;
      const isOpen = expandedSubs.has(node.id);
      const header = document.createElement('div');
      header.className = 'sub-header';
      header.style.cssText = `display:flex;align-items:center;gap:6px;padding:6px 10px 6px ${10+depth*14}px;font-size:11px;font-weight:600;color:${catColor};background:${catColor}${depth%2 ? '1f' : '14'};border-top:1px solid var(--border);cursor:grab;`;
      header.draggable = true;
      header.title = 'クリックで開閉／ドラッグで同じ階層内の順番変更';

      const arrow = document.createElement('span');
      arrow.textContent = isOpen ? '▼' : '▶';
      arrow.style.cssText = 'font-size:9px;';
      header.appendChild(arrow);
      const labelSpan = document.createElement('span');
      labelSpan.textContent = `${node.name} (${total})`;
      header.appendChild(labelSpan);

      header.addEventListener('click', ()=>{
        if(expandedSubs.has(node.id)){
          expandedSubs.delete(node.id);
        }else{
          expandedSubs.add(node.id);
          lastOpenedSub = node.id;
        }
        renderBuilderPhraseList();
      });
      header.addEventListener('dragstart', (ev)=>{
        draggedGroupId = node.id;
        draggedPhraseId = null;
        header.style.opacity = '.4';
        ev.dataTransfer.effectAllowed = 'move';
        try{ ev.dataTransfer.setData('text/plain','group'); }catch(e){}
      });
      header.addEventListener('dragend', ()=>{ header.style.opacity = '1'; });
      header.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
      header.addEventListener('drop', async (ev)=>{
        ev.preventDefault();
        if(draggedGroupId){
          if(draggedGroupId===node.id) return;
          const a = findGroupLoc(cat, draggedGroupId);
          const b = findGroupLoc(cat, node.id);
          if(a && b && a.arr===b.arr){
            a.arr.splice(a.index,1);
            b.arr.splice(b.arr.indexOf(node),0,a.node);
            draggedGroupId = null;
            await saveBuilderCats();
            renderBuilderPhraseList();
          }
          return;
        }
        if(draggedPhraseId){
          const draggedPh = cat.phrases.find(p=>p.id===draggedPhraseId);
          if(draggedPh){
            draggedPh.groupId = node.id;
            draggedPhraseId = null;
            expandedSubs.add(node.id);
            await saveBuilderCats();
            renderBuilderPhraseList(); renderBuilderCatRow();
          }
        }
      });
      area.appendChild(header);
      if(!isOpen) return;

      renderGroups(node.children||[], depth+1);
      appendPhraseRows(sortPhrases(cat.phrases.filter(p=>p.groupId===node.id)), depth+1);
    });
  }
  renderGroups(catGroups(cat), 0);

  /* 未分類 */
  const validIds = new Set(flattenGroups(cat).map(x=>x.node.id));
  const unclassified = cat.phrases.filter(p=>!p.groupId || !validIds.has(p.groupId));
  if(unclassified.length>0){
    const isOpen = expandedSubs.has('__unclassified__');
    const header = document.createElement('div');
    header.className = 'sub-header';
    header.style.cssText = `display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;font-weight:600;color:${catColor};background:${catColor}14;border-top:1px solid var(--border);cursor:pointer;`;
    header.title = 'クリックで開閉';
    const arrow = document.createElement('span');
    arrow.textContent = isOpen ? '▼' : '▶';
    arrow.style.cssText = 'font-size:9px;';
    header.appendChild(arrow);
    const labelSpan = document.createElement('span');
    labelSpan.textContent = `未分類 (${unclassified.length})`;
    header.appendChild(labelSpan);
    header.addEventListener('click', ()=>{
      if(expandedSubs.has('__unclassified__')) expandedSubs.delete('__unclassified__');
      else expandedSubs.add('__unclassified__');
      renderBuilderPhraseList();
    });
    header.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
    header.addEventListener('drop', async (ev)=>{
      ev.preventDefault();
      if(!draggedPhraseId) return;
      const draggedPh = cat.phrases.find(p=>p.id===draggedPhraseId);
      if(draggedPh){
        delete draggedPh.groupId;
        draggedPhraseId = null;
        await saveBuilderCats();
        renderBuilderPhraseList(); renderBuilderCatRow();
      }
    });
    area.appendChild(header);
    if(isOpen) appendPhraseRows(sortPhrases(unclassified), 0);
  }
}

function renderPhraseEditRow(cat, ph){
  const row = document.createElement('div');
  row.dataset.editing = '1';
  row.style.cssText='display:flex;flex-direction:column;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border);';
  row.innerHTML = `
    <select class="pe-group">${groupSelectOptions(cat, ph.groupId, '未分類（サブカテゴリなし）')}</select>
    <input type="text" class="pe-ja" value="${escHtml(ph.japanese)}">
    <textarea class="pe-en" rows="1" style="resize:none;overflow:hidden;">${escHtml(ph.english||'')}</textarea>
  `;
  const ta = row.querySelector('.pe-en');
  ta.addEventListener('input', ()=>autoGrowTextarea(ta));
  setTimeout(()=>autoGrowTextarea(ta), 0);
  const actionsRow = document.createElement('div');
  actionsRow.style.cssText='display:flex;gap:6px;justify-content:flex-end;';
  const saveBtn = document.createElement('button');
  saveBtn.className='btn small primary';
  saveBtn.textContent='保存';
  saveBtn.addEventListener('click', async ()=>{
    const ja = row.querySelector('.pe-ja').value.trim();
    const en = ta.value.replace(/\s*\n\s*/g,' ').trim();
    const gid = row.querySelector('.pe-group').value;
    if(!ja) return;
    ph.japanese = ja; ph.english = en;
    if(gid) ph.groupId = gid; else delete ph.groupId;
    editingPhraseId = null;
    await saveBuilderCats();
    renderBuilderPhraseList();
  });
  const cancelBtn = document.createElement('button');
  cancelBtn.className='btn small';
  cancelBtn.textContent='キャンセル';
  cancelBtn.addEventListener('click', ()=>{
    editingPhraseId = null;
    renderBuilderPhraseList();
  });
  actionsRow.appendChild(cancelBtn);
  actionsRow.appendChild(saveBtn);
  row.appendChild(actionsRow);
  return row;
}

function refreshQuickAddGroupSelect(cat, preselectId){
  const sel = document.getElementById('builderNewPhraseGroup');
  sel.innerHTML = groupSelectOptions(cat, preselectId, '未分類（サブカテゴリなし）');
}

document.getElementById('builderAddPhrase').addEventListener('click', async ()=>{
  const cat = getBuilderCat(builderSelectedCatId);
  if(!cat) return;
  const jaInput = document.getElementById('builderNewPhraseJa');
  const enInput = document.getElementById('builderNewPhraseEn');
  const groupSel = document.getElementById('builderNewPhraseGroup');
  const newGroupInput = document.getElementById('builderNewGroupName');
  const japanese = jaInput.value.trim();
  const english = enInput.value.trim();
  if(!japanese) return;
  let groupId = groupSel.value || '';
  const newName = newGroupInput.value.trim();
  if(newName){
    const node = {id:uid(), name:newName, children:[]};
    const parentLoc = groupId ? findGroupLoc(cat, groupId) : null;
    if(parentLoc){ parentLoc.node.children.push(node); }
    else { catGroups(cat).push(node); }
    groupId = node.id;
    lastOpenedSub = node.id;
  }
  const ph = {id:uid(), japanese, english, createdAt:Date.now()};
  if(groupId) ph.groupId = groupId;
  cat.phrases.push(ph);
  if(groupId) groupAncestorIds(cat, groupId).forEach(id=>expandedSubs.add(id));
  await saveBuilderCats();
  jaInput.value=''; enInput.value=''; newGroupInput.value='';
  refreshQuickAddGroupSelect(cat, groupId);
  renderBuilderPhraseList(); renderBuilderCatRow();
});

function splitCols(line){
  if(line.includes('|')){
    const parts = line.split('|').map(c=>c.trim());
    if(parts[0]==='') parts.shift();
    if(parts.length && parts[parts.length-1]==='') parts.pop();
    return parts;
  }
  if(line.includes('\t')) return line.split('\t').map(c=>c.trim());
  return line.split(',').map(c=>c.trim());
}

function importBuilderRows(rows){
  let added = 0, catsTouched = new Set();
  rows.forEach(cols=>{
    cols = cols.map(c=>String(c==null?'':c).trim());
    if(cols.length < 2) return;
    const catName = cols[0];
    if(!catName) return;
    if(/カテゴリ/.test(catName) && /英語|日本語/.test(cols.join(''))) return;
    const japanese = cols[1] || '';
    const english = cols[2] || '';
    if(!japanese) return;
    let cat = builderCats.find(c=>c.name===catName);
    if(!cat){ cat = {id:uid(), name:catName, phrases:[]}; builderCats.push(cat); }
    if(!cat.phrases.some(p=>p.japanese===japanese)){
      cat.phrases.push({id:uid(), japanese, english, createdAt:Date.now()});
      added++;
    }
    catsTouched.add(catName);
  });
  return {added, catCount: catsTouched.size};
}

document.getElementById('builderImportRun').addEventListener('click', async ()=>{
  const raw = document.getElementById('builderImportText').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0 && !/^[-|:\s]+$/.test(l));
  const rows = lines.map(splitCols);
  const {added, catCount} = importBuilderRows(rows);
  await saveBuilderCats();
  if(!builderSelectedCatId && builderCats[0]) builderSelectedCatId = builderCats[0].id;
  renderBuilderCatRow(); renderBuilderPhraseList();
  document.getElementById('builderImportResult').textContent = `${added}件のフレーズを${catCount}カテゴリに登録しました。`;
});

function parseCSVQuoted(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    }else{
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ }
      else field+=c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c.length>0));
}

document.getElementById('builderImportFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const resultEl = document.getElementById('builderImportResult');
  try{
    let rows;
    if(ext==='xlsx' || ext==='xls'){
      await loadXlsxLib();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''}).map(r=>r.map(c=>String(c).trim()));
    }else if(ext==='tsv'){
      const text = await file.text();
      rows = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0).map(l=>l.split('\t').map(c=>c.trim()));
    }else{
      const text = await file.text();
      rows = parseCSVQuoted(text);
    }
    const {added, catCount} = importBuilderRows(rows);
    await saveBuilderCats();
    if(!builderSelectedCatId && builderCats[0]) builderSelectedCatId = builderCats[0].id;
    renderBuilderCatRow(); renderBuilderPhraseList();
    resultEl.textContent = `${added}件のフレーズを${catCount}カテゴリに登録しました。`;
  }catch(err){
    resultEl.textContent = '読み込みに失敗しました: ' + (err && err.message ? err.message : String(err));
  }
  e.target.value = '';
});

document.getElementById('builderDeleteAll').addEventListener('click', async ()=>{
  if(builderCats.length===0){ alert('カテゴリがありません。'); return; }
  const totalPhrases = builderCats.reduce((sum,c)=>sum+c.phrases.length, 0);
  if(!confirm(`登録されている全カテゴリ（${builderCats.length}件）と、中のフレーズ（合計${totalPhrases}件）をすべて削除します。この操作は取り消せません。よろしいですか？`)) return;
  builderCats = [];
  builderSelectedCatId = null;
  await saveBuilderCats();
  renderBuilderCatRow(); renderBuilderPhraseList(); renderBuilderSelSummary();
});

function findPhraseRankByText(text, field){
  for(let i=0;i<builderCats.length;i++){
    if(builderCats[i].phrases.some(ph=>ph[field]===text)) return i;
  }
  return Infinity;
}

function mergeAndSortTags(existingStr, newItems, splitRegex, joiner){
  const existingItems = existingStr.split(splitRegex).map(s=>s.trim()).filter(Boolean);
  const allItems = [...existingItems];
  newItems.forEach(item=>{ if(!allItems.includes(item)) allItems.push(item); });
  const field = joiner===', ' ? 'english' : 'japanese';
  const withRank = allItems.map((item, idx)=>({item, idx, rank: findPhraseRankByText(item, field)}));
  withRank.sort((a,b)=> a.rank-b.rank || a.idx-b.idx);
  return withRank.map(x=>x.item).join(joiner);
}

let npPartsOff = {};   // {タグの日本語名: [OFFにした英語パーツ]}

function splitEnParts(en){ return String(en||'').split(',').map(s=>s.trim()).filter(Boolean); }

function derivedEnglishTagsFromText(jaTagsStr, partsOff){
  if(!jaTagsStr) return [];
  const items = jaTagsStr.split(/、\s*/).map(s=>s.trim()).filter(Boolean);
  const enList = [];
  items.forEach(item=>{
    for(const cat of builderCats){
      const ph = cat.phrases.find(p=>p.japanese===item);
      if(ph && ph.english){
        const off = partsOff && partsOff[item];
        const en = (off && off.length)
          ? splitEnParts(ph.english).filter(s=>!off.includes(s)).join(', ')
          : ph.english;
        if(en) enList.push(en);
        return;
      }
    }
  });
  return enList;
}

function renderPartsPanel(){
  const wrap = document.getElementById('np-parts-panel');

  wrap.innerHTML = '';

  const blocks = [];
  items.forEach(item=>{
    const cat = findCategoryByJapanese(item);
    if(!cat || !cat.partToggle) return;
    const ph = cat.phrases.find(p=>p.japanese===item);
    const parts = splitEnParts(ph && ph.english);
    if(parts.length<2) return;
    if(blocks.some(b=>b.item===item)) return;
    blocks.push({item, parts});
  });
  if(blocks.length===0) return;
  const panel = document.createElement('div');
  panel.className = 'parts-panel';
  const title = document.createElement('div');
  title.className = 'parts-title';
  title.textContent = 'パーツのON/OFF（クリックで切替。OFFのパーツは完成形から除かれます）';
  panel.appendChild(title);
  blocks.forEach(({item, parts})=>{

    const nm = document.createElement('div');
    nm.className = 'parts-tagname';
    nm.textContent = item;
    block.appendChild(nm);
    const chips = document.createElement('div');
    chips.className = 'parts-chips';
    parts.forEach(part=>{
      const off = (npPartsOff[item]||[]).includes(part);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'part-chip ' + (off ? 'off' : 'on');
      b.textContent = part;
      b.addEventListener('click', ()=>{
        const arr = npPartsOff[item] || (npPartsOff[item] = []);
        const i = arr.indexOf(part);
        if(i>=0) arr.splice(i,1); else arr.push(part);
        if(arr.length===0) delete npPartsOff[item];
        renderNpPreview();
      });
      chips.appendChild(b);
    });
    block.appendChild(chips);
    panel.appendChild(block);
  });
  wrap.appendChild(panel);
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w >= h){
        if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      }else{
        if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(blob) resolve(blob); else reject(new Error('画像の圧縮に失敗しました'));
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('画像の読み込みに失敗しました')); };
    img.src = url;
  });
}

async function savePromptForm(){
  const name = document.getElementById('np-name').value.trim();
  const japaneseTags = document.getElementById('np-ja-tags').value.trim();
  const japaneseSentence = document.getElementById('np-ja-sentence').value.trim();
  const positiveSentence = document.getElementById('np-pos-sentence').value.trim();
  const category = document.getElementById('np-category').value.trim();
  if(!name){
    alert('保存できませんでした。名前が空欄です。');
    return;
  }
  const savedId = editingPromptId || uid();
  let thumbnailUrl = editingPromptId ? (prompts.find(x=>x.id===editingPromptId)||{}).thumbnailUrl : undefined;

  if(selectedThumbFile){
    const statusEl = document.getElementById('np-thumb-status');
    statusEl.textContent = '画像を圧縮しています…';
    try{
      const compressed = await compressImage(selectedThumbFile, 360, 0.6);
      statusEl.textContent = '画像をアップロード中…';
      const path = `users/${currentUser.uid}/thumbnails/${savedId}.jpg`;
      const storageRef = window.fb.ref(window.fb.storageFb, path);
      await window.fb.uploadBytes(storageRef, compressed);
      thumbnailUrl = await window.fb.getDownloadURL(storageRef);
      statusEl.textContent = '';
    }catch(e){
      statusEl.textContent = '画像のアップロードに失敗しました: ' + (e && e.message ? e.message : String(e));
      alert('サムネイル画像のアップロードに失敗しました。プロンプト自体は保存を続行します。');
    }
  }else if(thumbRemoved){
    thumbnailUrl = null;
  }

  const tagSet = new Set(japaneseTags.split(/、\s*/).map(s=>s.trim()).filter(Boolean));
  const partsOff = {};
  Object.keys(npPartsOff).forEach(k=>{ if(tagSet.has(k) && npPartsOff[k].length) partsOff[k] = [...npPartsOff[k]]; });

  if(editingPromptId){
    const p = prompts.find(x=>x.id===editingPromptId);
    if(p){ p.partsOff=partsOff; p.name=name; p.category=category; p.japaneseTags=japaneseTags; p.japaneseSentence=japaneseSentence; p.positiveSentence=positiveSentence; p.thumbnailUrl=thumbnailUrl||null; p.updatedAt=Date.now(); }
  }else{
    const np = {id:savedId, name, category, partsOff, japaneseTags, japaneseSentence, positiveSentence, thumbnailUrl:thumbnailUrl||null, status:'untested', createdAt:Date.now(), updatedAt:Date.now(), parentId:null};
    prompts.unshift(np);
  }
  await savePrompts();
  renderPromptList();
  leaveEditScreen();
  editingPromptId = null;
}

function renderPromptList(){

    list = prompts.filter(p=>
      p.name.toLowerCase().includes(q) ||
      (p.category||'').toLowerCase().includes(q) ||
      (p.japaneseTags||'').toLowerCase().includes(q) ||
      (p.japaneseSentence||'').toLowerCase().includes(q) ||
      (p.positiveSentence||'').toLowerCase().includes(q)
    );
  }
  if(list.length===0){
    area.innerHTML = `<div class="empty">${q ? '一致するプロンプトがありません' : 'まだ保存されたプロンプトがありません。「+ 新しいプロンプト」から追加してください。'}</div>`;

  const catOrder = promptCatList().filter(cn=>list.some(p=>(p.category||'')===cn));

  const optionsList = document.getElementById('promptCategoryOptions');
  optionsList.innerHTML = promptCatList().map(cn=>`<option value="${escHtml(cn)}"></option>`).join('');

  function buildBlock(p){
    const block = document.createElement('div');
    block.className = 'prompt-block';

    if(p.thumbnailUrl){
      const thumb = document.createElement('img');
      thumb.src = p.thumbnailUrl;
      thumb.loading = 'lazy';
      thumb.decoding = 'async';
      thumb.className = 'prompt-block-thumb';
      block.appendChild(thumb);

      const ph = document.createElement('div');

      block.appendChild(ph);
    }

    const nameEl = document.createElement('div');
    nameEl.className = 'prompt-block-name';
    nameEl.textContent = p.name;
    block.appendChild(nameEl);

    const btnRow = document.createElement('div');
    btnRow.className = 'prompt-block-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn small';
    copyBtn.textContent = 'コピー';
    copyBtn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      navigator.clipboard.writeText(assembledPositive(p));
      copyBtn.textContent='✓'; setTimeout(()=>{copyBtn.textContent='コピー';},1200);
    });
    btnRow.appendChild(copyBtn);
    const editBtn = document.createElement('button');
    editBtn.className = 'btn small';
    editBtn.textContent = '編集';
    editBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); openEditForm(p); });
    btnRow.appendChild(editBtn);
    block.appendChild(btnRow);

    return block;
  }

  catOrder.forEach(cat=>{
    const items = list.filter(p=>(p.category||'')===cat);
    if(items.length===0) return;

    const key = cat || '__unclassified__';
    const header = document.createElement('div');
    header.className = 'sub-header';
    header.style.cssText = 'padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;';

    header.appendChild(arrow);
    const label = document.createElement('span');
    label.textContent = `${cat || '未分類'} (${items.length})`;
    header.appendChild(label);
    header.addEventListener('click', ()=>{
      if(expandedPromptCats.has(key)) expandedPromptCats.delete(key);
      else expandedPromptCats.add(key);
      renderPromptList();
    });
    area.appendChild(header);
    if(!isOpen) return;

    const grid = document.createElement('div');
    grid.className = 'prompt-grid';
    items.forEach(p=>grid.appendChild(buildBlock(p)));

    prompts.unshift(clone);

  document.getElementById('np-delete-btn').onclick = async ()=>{

}

async function orgMoveSelectedTags(destVal){
  if(!destVal){ alert('移動先を選択してください。'); return; }
  let target;
  if(destVal.startsWith('cat:')) target = {kind:'cat', catId:destVal.slice(4)};
  else { const parts = destVal.split(':'); target = {kind:'group', catId:parts[1], id:parts[2]}; }
  const dstCat = getBuilderCat(target.catId);
  if(!dstCat) return;

  const selGroups = [...orgSelGroups].map(([id,catId])=>({id,catId}));
  const selIds = new Set(selGroups.map(g=>g.id));
  const topGroups = selGroups.filter(g=>{
    const cat = getBuilderCat(g.catId);
    if(!cat || !findGroupLoc(cat, g.id)) return false;
    return !groupAncestorIds(cat, g.id).slice(0,-1).some(a=>selIds.has(a));
  });
  const coveredGroupIds = new Set();
  topGroups.forEach(g=>{
    const cat = getBuilderCat(g.catId); const loc = findGroupLoc(cat, g.id);
    subtreeIds(loc.node).forEach(i=>coveredGroupIds.add(i));
  });
  const phrases = [...orgSelPhrases].map(([id,catId])=>({id,catId})).filter(x=>{
    const cat = getBuilderCat(x.catId);
    const ph = cat && cat.phrases.find(p=>p.id===x.id);
    return ph && !(ph.groupId && coveredGroupIds.has(ph.groupId));
  });

  let moved = 0, skipped = 0;
  topGroups.forEach(g=>{
    const r = orgMutate({kind:'group', id:g.id, catId:g.catId}, target, 'inside');
    if(r==='tags') moved++; else skipped++;
  });
  phrases.forEach(x=>{
    const r = orgMutate({kind:'phrase', id:x.id, catId:x.catId}, target, 'inside');
    if(r==='tags') moved++; else skipped++;
  });
  orgSelPhrases.clear(); orgSelGroups.clear();
  orgOpen.add('c:'+target.catId);
  if(target.kind==='group') groupAncestorIds(dstCat, target.id).forEach(id=>orgOpen.add(id));
  else orgOpen.add('u:'+target.catId);
  await saveBuilderCats();
  renderOrgTags();
  if(skipped>0) alert(`${skipped}件は移動先がその項目の内側のため、移動できませんでした。`);
}
async function orgMoveSelectedPrompts(destVal){
  if(destVal===''){ alert('移動先を選択してください。'); return; }
  const name = destVal==='__none__' ? '' : destVal;
  [...orgSelPrompts].forEach(id=>orgMutate({kind:'prompt', id}, {kind:'pcat', name}, 'inside'));
  orgSelPrompts.clear();
  await savePrompts();
  renderOrgPrompts();
}

/* ---- ドラッグ&ドロップ ---- */
function orgClearIndicators(){
  document.querySelectorAll('.org-drop-before,.org-drop-after,.org-drop-inside').forEach(el=>{
    el.classList.remove('org-drop-before','org-drop-after','org-drop-inside');
  });
}
function orgAllowedZones(drag, target){
  const k = drag.kind, t = target.kind;
  if(k==='phrase'){
    if(t==='phrase') return drag.id===target.id ? [] : ['before','after'];
    if(t==='cat' || t==='uncl' || t==='group') return ['inside'];
  }
  if(k==='group'){
    if(t==='cat' || t==='uncl') return ['inside'];
    if(t==='group'){
      if(drag.id===target.id) return [];
      const sc = getBuilderCat(drag.catId);
      const loc = sc && findGroupLoc(sc, drag.id);
      if(loc && drag.catId===target.catId && subtreeIds(loc.node).includes(target.id)) return [];
      return ['before','inside','after'];
    }
  }
  if(k==='cat'){ if(t==='cat' && drag.id!==target.catId) return ['before','after']; }
  if(k==='prompt'){
    if(t==='pcat') return ['inside'];
    if(t==='prow') return drag.id===target.id ? [] : ['before','after'];
  }
  if(k==='pcat'){ if(t==='pcat' && target.name && drag.name!==target.name) return ['before','after']; }
  return [];
}
function orgPickZone(ev, el, allowed){
  if(allowed.length===1) return allowed[0];
  const r = el.getBoundingClientRect();
  const h = r.height || 1;
  const y = ev.clientY - r.top;
  if(allowed.length===2) return y < h/2 ? 'before' : 'after';
  return y < h*0.28 ? 'before' : (y > h*0.72 ? 'after' : 'inside');
}
function orgAttachDrag(row, info, handleEl){
  if(handleEl){
    row.draggable = false;
    handleEl.addEventListener('mousedown', ()=>{ row.draggable = true; });
  }else{
    row.draggable = true;
  }
  row.addEventListener('dragstart', (ev)=>{
    orgDrag = info;
    ev.dataTransfer.effectAllowed = 'move';
    try{ ev.dataTransfer.setData('text/plain','org'); }catch(e){}
    row.style.opacity = '.45';
  });
  row.addEventListener('dragend', ()=>{
    row.style.opacity = '1';
    orgDrag = null;
    orgClearIndicators();
    if(handleEl) row.draggable = false;
  });
}
function orgAttachDrop(row, target){
  row.addEventListener('dragover', (ev)=>{
    if(!orgDrag) return;
    const allowed = orgAllowedZones(orgDrag, target);
    if(!allowed.length) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    orgClearIndicators();
    row.classList.add('org-drop-' + orgPickZone(ev, row, allowed));
  });
  row.addEventListener('drop', async (ev)=>{
    if(!orgDrag) return;
    const allowed = orgAllowedZones(orgDrag, target);
    if(!allowed.length) return;
    ev.preventDefault();
    const zone = orgPickZone(ev, row, allowed);
    orgClearIndicators();
    const d = orgDrag; orgDrag = null;
    await orgApplyDrop(d, target, zone);
  });
}

/* ---- データ操作（保存・再描画なし）。変更があれば 'tags' / 'prompts' / 'pcat' を返す ---- */
function orgMutate(drag, target, zone){
  if(drag.kind==='phrase'){
    const srcCat = getBuilderCat(drag.catId);
    const dstCat = getBuilderCat(target.catId);
    const ph = srcCat && srcCat.phrases.find(p=>p.id===drag.id);
    if(!ph || !dstCat) return null;
    if(target.kind==='phrase'){
      const ref = dstCat.phrases.find(p=>p.id===target.id);
      if(!ref || ref.id===ph.id) return null;
      const gid = ref.groupId;
      srcCat.phrases = srcCat.phrases.filter(p=>p.id!==ph.id);
      if(gid) ph.groupId = gid; else delete ph.groupId;
      let idx = dstCat.phrases.findIndex(p=>p.id===ref.id);
      if(idx<0) idx = dstCat.phrases.length; else if(zone==='after') idx++;
      dstCat.phrases.splice(idx, 0, ph);
    }else{
      srcCat.phrases = srcCat.phrases.filter(p=>p.id!==ph.id);
      if(target.kind==='group'){ ph.groupId = target.id; orgOpen.add(target.id); }
      else { delete ph.groupId; if(target.kind==='uncl') orgOpen.add('u:'+dstCat.id); }
      dstCat.phrases.push(ph);
    }
    orgOpen.add('c:'+dstCat.id);
    return 'tags';
  }
  if(drag.kind==='group'){
    const srcCat = getBuilderCat(drag.catId);
    const dstCat = getBuilderCat(target.catId);
    const loc = srcCat && findGroupLoc(srcCat, drag.id);
    if(!loc || !dstCat || target.kind==='phrase') return null;
    const node = loc.node;
    const ids = subtreeIds(node);
    let destArr, ref = null;
    if(target.kind==='group'){
      if(srcCat===dstCat && ids.includes(target.id)) return null;
      const tl = findGroupLoc(dstCat, target.id);
      if(!tl) return null;
      if(zone==='inside'){ destArr = tl.node.children; orgOpen.add(target.id); }
      else { destArr = tl.arr; ref = tl.node; }
    }else{
      destArr = catGroups(dstCat);
    }
    loc.arr.splice(loc.index, 1);
    let idx = ref ? destArr.indexOf(ref) : destArr.length;
    if(ref && zone==='after') idx++;
    destArr.splice(idx, 0, node);
    if(srcCat!==dstCat){
      const moving = srcCat.phrases.filter(p=>ids.includes(p.groupId));
      srcCat.phrases = srcCat.phrases.filter(p=>!ids.includes(p.groupId));
      dstCat.phrases.push(...moving);
    }
    orgOpen.add('c:'+dstCat.id);
    return 'tags';
  }
  if(drag.kind==='cat'){
    const from = builderCats.findIndex(c=>c.id===drag.id);
    if(from<0) return null;
    const [moved] = builderCats.splice(from, 1);
    let idx = builderCats.findIndex(c=>c.id===target.catId);
    if(idx<0){ builderCats.splice(from, 0, moved); return null; }
    if(zone==='after') idx++;
    builderCats.splice(idx, 0, moved);
    return 'tags';
  }
  if(drag.kind==='prompt'){
    const p = prompts.find(x=>x.id===drag.id);
    if(!p) return null;
    if(target.kind==='prow'){
      const ref = prompts.find(x=>x.id===target.id);
      if(!ref || ref.id===p.id) return null;
      prompts = prompts.filter(x=>x.id!==p.id);
      p.category = ref.category || '';
      let idx = prompts.findIndex(x=>x.id===ref.id);
      if(zone==='after') idx++;
      prompts.splice(idx, 0, p);
    }else if(target.kind==='pcat'){
      p.category = target.name || '';
      orgOpen.add('pc:'+(target.name||''));
    }else return null;
    return 'prompts';
  }
  if(drag.kind==='pcat'){
    const list = promptCatList();
    const from = list.indexOf(drag.name);
    if(from<0 || !target.name) return null;
    list.splice(from, 1);
    let idx = list.indexOf(target.name);
    if(idx<0) return null;
    if(zone==='after') idx++;
    list.splice(idx, 0, drag.name);
    data.settings.promptCategories = list;
    return 'pcat';
  }
  return null;
}
async function orgApplyDrop(drag, target, zone){
  const r = orgMutate(drag, target, zone);
  if(r==='tags'){ await saveBuilderCats(); renderOrgTags(); }
  else if(r==='prompts'){ await savePrompts(); renderOrgPrompts(); }
  else if(r==='pcat'){ await saveSettings(); renderOrgPrompts(); }
}

/* ---- タグの整理 ---- */
function renderOrgTags(){
  const wrap = document.getElementById('orgTagsView');
  wrap.innerHTML = '';

  const bar = document.createElement('div');
  bar.className = 'org-toolbar';
  const addCat = document.createElement('button');
  addCat.className = 'btn small'; addCat.textContent = '＋ カテゴリ追加';
  addCat.addEventListener('click', async ()=>{
    const name = prompt('カテゴリ名'); if(!name || !name.trim()) return;
    const cat = {id:uid(), name:name.trim(), phrases:[], groups:[]};
    builderCats.push(cat); orgOpen.add('c:'+cat.id);
    await saveBuilderCats(); renderOrgTags();
  });
  const openAll = document.createElement('button');
  openAll.className = 'btn small'; openAll.textContent = 'すべて開く';
  openAll.addEventListener('click', ()=>{
    builderCats.forEach(cat=>{
      orgOpen.add('c:'+cat.id); orgOpen.add('u:'+cat.id);
      flattenGroups(cat).forEach(x=>orgOpen.add(x.node.id));
    });
    renderOrgTags();
  });
  const closeAll = document.createElement('button');
  closeAll.className = 'btn small'; closeAll.textContent = 'すべて閉じる';
  closeAll.addEventListener('click', ()=>{ orgOpen.clear(); renderOrgTags(); });
