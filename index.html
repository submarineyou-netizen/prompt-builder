  wrap.appendChild(bar);

  const hint = document.createElement('p');
  hint.className = 'org-hint';
  hint.textContent = 'タグやサブカテゴリの左のチェックボックスで選ぶと、上に「移動先」のバーが出ます。まとめて移動できます。ドラッグでも移動できます（サブカテゴリの行の真ん中にドロップ＝その中へ／上端・下端＝同じ階層で並び替え）。';
  wrap.appendChild(hint);

  if(builderCats.length===0){
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'カテゴリがありません。'; wrap.appendChild(e);
    updateOrgSelBar();
    return;
  }
  builderCats.forEach(cat=>wrap.appendChild(buildOrgCatBox(cat)));
  updateOrgSelBar();
}

function buildOrgCatBox(cat){
  const box = document.createElement('div');
  box.className = 'org-box';
  const color = categoryColorFor(cat.id);
  const open = orgOpen.has('c:'+cat.id);

  const head = orgRowEl();
  head.style.cssText = `border-left:5px solid ${color};background:${color}22;font-weight:600;`;
  head.appendChild(orgHandle());
  head.appendChild(orgArrow(open));
  const nm = document.createElement('span'); nm.textContent = cat.name; nm.style.cursor = 'pointer';
  head.appendChild(nm);
  const cnt = document.createElement('span'); cnt.className = 'org-count'; cnt.textContent = `(${cat.phrases.length})`;
  head.appendChild(cnt);
  head.appendChild(orgSpacer());
  head.appendChild(orgBtn(cat.partToggle ? '🧩パーツ切替：有効' : '🧩パーツ切替：無効',
    'タグの英語を「,」区切りのパーツ単位でON/OFFできるようにします（衣装向け）。クリックで切替',
    async ()=>{ cat.partToggle = !cat.partToggle; await saveBuilderCats(); renderOrgTags(); },
    cat.partToggle ? 'org-btn-on' : ''));
  head.appendChild(orgBtn('＋', 'サブカテゴリを追加', async ()=>{
    const name = prompt(`「${cat.name}」の中にサブカテゴリを追加`); if(!name || !name.trim()) return;
    const node = {id:uid(), name:name.trim(), children:[]};
    catGroups(cat).push(node); orgOpen.add('c:'+cat.id);
    await saveBuilderCats(); renderOrgTags();
  }));
  head.appendChild(orgBtn('✎', 'カテゴリ名を変更', async ()=>{
    const name = prompt('カテゴリ名', cat.name); if(!name || !name.trim()) return;
    cat.name = name.trim(); await saveBuilderCats(); renderOrgTags();
  }));
  head.appendChild(orgBtn('×', 'カテゴリを削除', async ()=>{
    if(!confirm(`カテゴリ「${cat.name}」を、中のタグ（${cat.phrases.length}件）ごと削除しますか？`)) return;
    builderCats = builderCats.filter(c=>c.id!==cat.id);
    if(builderSelectedCatId===cat.id) builderSelectedCatId = builderCats[0] ? builderCats[0].id : null;
    await saveBuilderCats(); renderOrgTags();
  }, 'org-del'));
  head.addEventListener('click', ()=>orgToggle('c:'+cat.id));
  orgAttachDrag(head, {kind:'cat', id:cat.id, catId:cat.id}, null);
  orgAttachDrop(head, {kind:'cat', catId:cat.id});
  box.appendChild(head);

  if(open){
    orgRenderGroups(cat, catGroups(cat), 0, box, color);
    const valid = new Set(flattenGroups(cat).map(x=>x.node.id));
    const uncl = cat.phrases.filter(p=>!p.groupId || !valid.has(p.groupId));
    const uOpen = orgOpen.has('u:'+cat.id);
    const uh = orgRowEl();
    uh.style.cssText = `padding-left:${8+18}px;color:var(--text-2);font-weight:600;background:${color}10;`;
    uh.appendChild(orgArrow(uOpen));
    const ul = document.createElement('span'); ul.textContent = `未分類 (${uncl.length})`; ul.style.cursor = 'pointer';
    uh.appendChild(ul);
    uh.addEventListener('click', ()=>orgToggle('u:'+cat.id));
    orgAttachDrop(uh, {kind:'uncl', catId:cat.id});
    box.appendChild(uh);
    if(uOpen) uncl.forEach(ph=>box.appendChild(orgPhraseRow(cat, ph, 0, color)));
  }
  return box;
}

function orgRenderGroups(cat, arr, depth, parentEl, color){
  arr.forEach(node=>{
    const ids = subtreeIds(node);
    const total = cat.phrases.filter(p=>ids.includes(p.groupId)).length;
    const open = orgOpen.has(node.id);
    const row = orgRowEl();
    row.style.cssText = `padding-left:${8+(depth+1)*18}px;font-weight:600;background:${color}${depth%2?'1c':'12'};`;
    row.appendChild(orgCheckbox(orgSelGroups.has(node.id), on=>{ if(on) orgSelGroups.set(node.id, cat.id); else orgSelGroups.delete(node.id); }));
    row.appendChild(orgHandle());
    row.appendChild(orgArrow(open));
    const nm = document.createElement('span'); nm.textContent = node.name; nm.style.cursor = 'pointer';
    row.appendChild(nm);
    const cnt = document.createElement('span'); cnt.className = 'org-count'; cnt.textContent = `(${total})`;
    row.appendChild(cnt);
    row.appendChild(orgSpacer());
    row.appendChild(orgBtn('＋', 'この中にサブカテゴリを追加', async ()=>{
      const name = prompt(`「${node.name}」の中にサブカテゴリを追加`); if(!name || !name.trim()) return;
      node.children.push({id:uid(), name:name.trim(), children:[]}); orgOpen.add(node.id);
      await saveBuilderCats(); renderOrgTags();
    }));
    row.appendChild(orgBtn('✎', 'サブカテゴリ名を変更', async ()=>{
      const name = prompt('サブカテゴリ名', node.name); if(!name || !name.trim()) return;
      node.name = name.trim(); await saveBuilderCats(); renderOrgTags();
    }));
    row.appendChild(orgBtn('×', 'サブカテゴリを削除', async ()=>{
      if(!confirm(`サブカテゴリ「${node.name}」を削除しますか？\n（中のタグ・サブカテゴリは一つ上の階層に移動します）`)) return;
      const loc = findGroupLoc(cat, node.id);
      if(!loc) return;
      loc.arr.splice(loc.index, 1, ...(node.children||[]));
      cat.phrases.forEach(p=>{
        if(p.groupId===node.id){ if(loc.parent) p.groupId = loc.parent.id; else delete p.groupId; }
      });
      await saveBuilderCats(); renderOrgTags();
    }, 'org-del'));
    row.addEventListener('click', ()=>orgToggle(node.id));
    orgAttachDrag(row, {kind:'group', id:node.id, catId:cat.id}, null);
    orgAttachDrop(row, {kind:'group', id:node.id, catId:cat.id});
    parentEl.appendChild(row);
    if(open){
      orgRenderGroups(cat, node.children||[], depth+1, parentEl, color);
      cat.phrases.filter(p=>p.groupId===node.id).forEach(ph=>parentEl.appendChild(orgPhraseRow(cat, ph, depth+1, color)));
    }
  });
}

function orgPhraseRow(cat, ph, depth, color){
  const row = orgRowEl();
  row.dataset.phraseId = ph.id;
  row.style.cssText = `padding-left:${8+(depth+1)*18}px;border-left:4px solid ${color};background:${color}0d;`;
  if(orgEditingPhraseId===ph.id){
    row.style.flexWrap = 'wrap';
    row.innerHTML = `<input type="text" class="oe-ja" value="${escHtml(ph.japanese)}" style="flex:1 1 100%;min-width:0;"><textarea class="oe-en" rows="1" style="flex:1 1 100%;min-width:0;resize:none;overflow:hidden;">${escHtml(ph.english||'')}</textarea>`;
    const ta = row.querySelector('.oe-en');
    ta.addEventListener('input', ()=>autoGrowTextarea(ta));
    setTimeout(()=>autoGrowTextarea(ta), 0);
    const ok = document.createElement('button'); ok.className = 'btn small primary'; ok.textContent = '保存';
    ok.addEventListener('click', async ()=>{
      const ja = row.querySelector('.oe-ja').value.trim();
      if(!ja) return;
      ph.japanese = ja; ph.english = ta.value.replace(/\s*\n\s*/g,' ').trim();
      orgEditingPhraseId = null; await saveBuilderCats(); renderOrgTags();
    });
    const ng = document.createElement('button'); ng.className = 'btn small'; ng.textContent = 'キャンセル';
    ng.addEventListener('click', ()=>{ orgEditingPhraseId = null; renderOrgTags(); });
    row.appendChild(ok); row.appendChild(ng);
    return row;
  }
  row.appendChild(orgCheckbox(orgSelPhrases.has(ph.id), on=>{ if(on) orgSelPhrases.set(ph.id, cat.id); else orgSelPhrases.delete(ph.id); }));
  row.appendChild(orgHandle());
  const t = document.createElement('span'); t.style.flex = '1'; t.style.minWidth = '0';
  t.textContent = (ph.favorite ? '★ ' : '') + ph.japanese;
  if(ph.english) t.title = ph.english;
  row.appendChild(t);
  row.appendChild(orgBtn('✎', 'タグを編集', ()=>{ orgEditingPhraseId = ph.id; renderOrgTags(); }));
  row.appendChild(orgBtn('×', 'タグを削除', async ()=>{
    if(!confirm(`「${ph.japanese}」を削除しますか？`)) return;
    cat.phrases = cat.phrases.filter(p=>p.id!==ph.id);
    await saveBuilderCats(); renderOrgTags();
  }, 'org-del'));
  orgAttachDrag(row, {kind:'phrase', id:ph.id, catId:cat.id}, null);
  orgAttachDrop(row, {kind:'phrase', id:ph.id, catId:cat.id});
  return row;
}

/* ---- プロンプトの整理 ---- */
function renderOrgPrompts(){
  const wrap = document.getElementById('orgPromptsView');
  wrap.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'org-toolbar';
  const add = document.createElement('button');
  add.className = 'btn small'; add.textContent = '＋ カテゴリ追加';
  add.addEventListener('click', async ()=>{
    const name = prompt('カテゴリ名'); if(!name || !name.trim()) return;
    const list = promptCatList();
    if(!list.includes(name.trim())) list.push(name.trim());
    data.settings.promptCategories = list; orgOpen.add('pc:'+name.trim());
    await saveSettings(); renderOrgPrompts();
  });
  const openAll = document.createElement('button');
  openAll.className = 'btn small'; openAll.textContent = 'すべて開く';
  openAll.addEventListener('click', ()=>{ promptCatList().concat(['']).forEach(n=>orgOpen.add('pc:'+n)); renderOrgPrompts(); });
  const closeAll = document.createElement('button');
  closeAll.className = 'btn small'; closeAll.textContent = 'すべて閉じる';
  closeAll.addEventListener('click', ()=>{ promptCatList().concat(['']).forEach(n=>orgOpen.delete('pc:'+n)); renderOrgPrompts(); });
  bar.appendChild(add); bar.appendChild(openAll); bar.appendChild(closeAll);
  wrap.appendChild(bar);

  const hint = document.createElement('p');
  hint.className = 'org-hint';
  hint.textContent = '名前の欄はそのまま書き換えられます。左のチェックボックスで選ぶと、上の「移動先」バーからまとめて別カテゴリへ移動できます。⠿ をつかんでドラッグしても移動・並び替えができます。';
  wrap.appendChild(hint);

  if(prompts.length===0 && promptCatList().length===0){
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'プロンプトがありません。'; wrap.appendChild(e);
    updateOrgSelBar();
    return;
  }
  promptCatList().forEach(n=>wrap.appendChild(buildOrgPromptCat(n)));
  wrap.appendChild(buildOrgPromptCat(''));
  updateOrgSelBar();
}

function buildOrgPromptCat(name){
  const box = document.createElement('div');
  box.className = 'org-box';
  const items = prompts.filter(p=>(p.category||'')===name);
  const key = 'pc:'+name;
  const open = orgOpen.has(key);
  const head = orgRowEl();
  head.style.cssText = 'background:var(--panel-2);font-weight:600;';
  let handle = null;
  if(name){ handle = orgHandle(); head.appendChild(handle); }
  head.appendChild(orgArrow(open));
  const nm = document.createElement('span'); nm.textContent = name || '未分類'; nm.style.cursor = 'pointer';
  head.appendChild(nm);
  const cnt = document.createElement('span'); cnt.className = 'org-count'; cnt.textContent = `(${items.length})`;
  head.appendChild(cnt);
  head.appendChild(orgSpacer());
  if(name){
    head.appendChild(orgBtn('✎', 'カテゴリ名を変更', async ()=>{
      const nn = prompt('カテゴリ名', name); if(!nn || !nn.trim() || nn.trim()===name) return;
      const newName = nn.trim();
      prompts.forEach(p=>{ if((p.category||'')===name) p.category = newName; });
      const list = promptCatList().map(c=>c===name ? newName : c);
      data.settings.promptCategories = list.filter((c,i)=>list.indexOf(c)===i);
      if(orgOpen.has(key)){ orgOpen.delete(key); orgOpen.add('pc:'+newName); }
      await savePrompts(); await saveSettings(); renderOrgPrompts();
    }));
    head.appendChild(orgBtn('×', 'カテゴリを削除（中身は未分類へ）', async ()=>{
      if(!confirm(`カテゴリ「${name}」を削除しますか？\n（中のプロンプト${items.length}件は「未分類」に移動します）`)) return;
      prompts.forEach(p=>{ if((p.category||'')===name) p.category = ''; });
      data.settings.promptCategories = promptCatList().filter(c=>c!==name);
      await savePrompts(); await saveSettings(); renderOrgPrompts();
    }, 'org-del'));
  }
  head.addEventListener('click', ()=>orgToggle(key));
  if(name) orgAttachDrag(head, {kind:'pcat', name}, handle);
  orgAttachDrop(head, {kind:'pcat', name});
  box.appendChild(head);

  if(open){
    items.forEach(p=>box.appendChild(orgPromptRow(p)));
    if(items.length===0){
      const e = document.createElement('div'); e.className = 'org-empty'; e.textContent = 'ここにドラッグして移動できます';
      box.appendChild(e);
    }
  }
  return box;
}

function orgPromptRow(p){
  const row = orgRowEl();
  row.style.paddingLeft = '14px';
  row.appendChild(orgCheckbox(orgSelPrompts.has(p.id), on=>{ if(on) orgSelPrompts.add(p.id); else orgSelPrompts.delete(p.id); }));
  const handle = orgHandle();
  row.appendChild(handle);
  if(p.thumbnailUrl){
    const im = document.createElement('img');
    im.src = p.thumbnailUrl; im.loading = 'lazy'; im.className = 'org-thumb';
    row.appendChild(im);
  }else{
    const ph = document.createElement('span'); ph.className = 'org-thumb org-thumb-empty'; row.appendChild(ph);
  }
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = p.name; inp.className = 'org-name-input';
  inp.addEventListener('change', async ()=>{
    const v = inp.value.trim();
    if(!v){ inp.value = p.name; return; }
    p.name = v; p.updatedAt = Date.now();
    await savePrompts();
  });
  inp.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') inp.blur(); });
  row.appendChild(inp);
  orgAttachDrag(row, {kind:'prompt', id:p.id}, handle);
  orgAttachDrop(row, {kind:'prow', id:p.id});
  return row;
}

/* ---- 画面の入口・イベント ---- */
document.getElementById('organizerBtn').addEventListener('click', ()=>showOrganizerScreen('list'));
document.getElementById('orgBackBtn').addEventListener('click', ()=>{
  const back = orgReturn; orgReturn = 'list';
  if(back==='news') showNewsScreen(); else { showListScreen(); renderPromptList(); }
});
document.getElementById('orgTabTags').addEventListener('click', ()=>{ orgTab = 'tags'; orgSelPrompts.clear(); orgDestValue = ''; renderOrganizer(); });
document.getElementById('orgTabPrompts').addEventListener('click', ()=>{ orgTab = 'prompts'; orgSelPhrases.clear(); orgSelGroups.clear(); orgDestValue = ''; renderOrganizer(); });


/* ================= 新着 ================= */
let newsFilter = 'all';   // 'all' | 'prompt' | 'tag'
let newsLimit = 50;

function showNewsScreen(){
  document.getElementById('newPromptForm').classList.remove('open');
  document.getElementById('organizerScreen').style.display = 'none';
  document.getElementById('promptList').style.display = 'none';
  document.getElementById('listToprow').style.display = 'none';
  document.getElementById('backupResult').style.display = 'none';
  document.getElementById('newsScreen').style.display = 'block';
  newsLimit = 50;
  renderNews();
}

function collectNewsItems(){
  const items = [];
  prompts.forEach(p=>{ if(p.createdAt) items.push({kind:'prompt', ts:p.createdAt, p}); });
  builderCats.forEach(cat=>{
    cat.phrases.forEach(ph=>{ if(ph.createdAt) items.push({kind:'tag', ts:ph.createdAt, cat, ph}); });
  });
  items.sort((a,b)=>b.ts-a.ts);
  return items;
}

function newsDayInfo(ts){
  const d = new Date(ts);
  const ymd = x=>x.getFullYear()*10000 + (x.getMonth()+1)*100 + x.getDate();
  const pad = n=>String(n).padStart(2,'0');
  let label = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${'日月火水木金土'[d.getDay()]}）`;
  const today = new Date();
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if(ymd(d)===ymd(today)) label = '今日　' + label;
  else if(ymd(d)===ymd(yest)) label = '昨日　' + label;
  return {key:ymd(d), label};
}
function newsTimeText(ts){
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function newsTagLocation(cat, ph){
  const flat = flattenGroups(cat);
  const g = ph.groupId ? flat.find(x=>x.node.id===ph.groupId) : null;
  return cat.name + (g ? ' › ' + g.label : '');
}

function buildNewsRow(it){
  const row = document.createElement('div');
  row.className = 'news-row';
  const badge = document.createElement('span');
  badge.className = 'news-badge ' + it.kind;
  badge.textContent = it.kind==='prompt' ? 'プロンプト' : 'タグ';
  row.appendChild(badge);

  if(it.kind==='prompt'){
    const p = it.p;
    if(p.thumbnailUrl){
      const im = document.createElement('img');
      im.src = p.thumbnailUrl; im.loading = 'lazy'; im.className = 'org-thumb';
      row.appendChild(im);
    }
    const box = document.createElement('div');
    box.style.cssText = 'flex:1;min-width:0;';
    const nm = document.createElement('div'); nm.className = 'news-title'; nm.textContent = p.name;
    const sub = document.createElement('div'); sub.className = 'news-sub'; sub.textContent = p.category || '未分類';
    box.appendChild(nm); box.appendChild(sub);
    row.appendChild(box);
    row.title = 'クリックで編集画面へ';
    row.addEventListener('click', ()=>{ editReturn = 'news'; openEditForm(p); });
  }else{
    const box = document.createElement('div');
    box.style.cssText = 'flex:1;min-width:0;';
    const nm = document.createElement('div'); nm.className = 'news-title'; nm.textContent = it.ph.japanese;
    if(it.ph.english) nm.title = it.ph.english;
    const sub = document.createElement('div'); sub.className = 'news-sub'; sub.textContent = '📍 ' + newsTagLocation(it.cat, it.ph);
    box.appendChild(nm); box.appendChild(sub);
    row.appendChild(box);
    row.title = 'クリックで配置されている場所へ';
    row.addEventListener('click', ()=>newsRevealTag(it.cat.id, it.ph.id));
  }
  const tm = document.createElement('span');
  tm.className = 'news-time'; tm.textContent = newsTimeText(it.ts);
  row.appendChild(tm);
  return row;
}

function renderNews(){
  ['all','prompt','tag'].forEach(k=>{
    const id = k==='all' ? 'newsFilterAll' : (k==='prompt' ? 'newsFilterPrompt' : 'newsFilterTag');
    document.getElementById(id).className = 'btn small' + (newsFilter===k ? ' primary' : '');
  });
  const wrap = document.getElementById('newsList');
  wrap.innerHTML = '';
  const items = collectNewsItems().filter(it=>newsFilter==='all' || it.kind===newsFilter);
  if(items.length===0){
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = newsFilter==='tag' ? 'まだ新着のタグはありません。' : '新着はありません。';
    wrap.appendChild(e);
  }
  let lastKey = null;
  items.slice(0, newsLimit).forEach(it=>{
    const di = newsDayInfo(it.ts);
    if(di.key!==lastKey){
      const h = document.createElement('div'); h.className = 'news-day'; h.textContent = di.label;
      wrap.appendChild(h); lastKey = di.key;
    }
    wrap.appendChild(buildNewsRow(it));
  });
  if(items.length>newsLimit){
    const more = document.createElement('button');
    more.className = 'btn small'; more.textContent = `もっと見る（残り${items.length-newsLimit}件）`;
    more.addEventListener('click', ()=>{ newsLimit += 50; renderNews(); });
    wrap.appendChild(more);
  }
  if(newsFilter!=='prompt'){
    const note = document.createElement('p');
    note.className = 'org-hint'; note.style.marginTop = '14px';
    note.textContent = 'タグは、この機能の追加後に登録したものから表示されます（それ以前のタグは登録日が記録されていません）。';
    wrap.appendChild(note);
  }
}

/* タグ → 整理ページ（タグ）で配置場所まで開いて、その行へジャンプ */
function newsRevealTag(catId, phId){
  const cat = getBuilderCat(catId);
  const ph = cat && cat.phrases.find(p=>p.id===phId);
  if(!ph) return;
  orgTab = 'tags';
  orgOpen.add('c:'+catId);
  const valid = new Set(flattenGroups(cat).map(x=>x.node.id));
  if(ph.groupId && valid.has(ph.groupId)) groupAncestorIds(cat, ph.groupId).forEach(id=>orgOpen.add(id));
  else orgOpen.add('u:'+catId);
  showOrganizerScreen('news');
  const row = document.querySelector(`#orgTagsView [data-phrase-id="${phId}"]`);
  if(row){
    row.scrollIntoView({block:'center'});
    row.classList.add('org-flash');
    setTimeout(()=>row.classList.remove('org-flash'), 1900);
  }
}

document.getElementById('newsBtn').addEventListener('click', ()=>showNewsScreen());
document.getElementById('newsBackBtn').addEventListener('click', ()=>{ showListScreen(); renderPromptList(); });
document.getElementById('newsFilterAll').addEventListener('click', ()=>{ newsFilter = 'all'; newsLimit = 50; renderNews(); });
document.getElementById('newsFilterPrompt').addEventListener('click', ()=>{ newsFilter = 'prompt'; newsLimit = 50; renderNews(); });
document.getElementById('newsFilterTag').addEventListener('click', ()=>{ newsFilter = 'tag'; newsLimit = 50; renderNews(); });


/* ---------- backup export / import ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const backup = {
    exportedAt: new Date().toISOString(),
    categories: data.categories,
    builderCategories: builderCats,
    settings: data.settings,
    prompts: prompts
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const pad = n=>String(n).padStart(2,'0');
  const d = new Date();
  a.href = url;
  a.download = `prompt-builder-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBackupFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const resultEl = document.getElementById('backupResult');
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.categories && !backup.prompts) throw new Error('バックアップファイルの形式が正しくありません');
    const mode = confirm('OK＝今のデータを上書きして復元／キャンセル＝今のデータに追加でマージ');
    if(mode){
      data.categories = backup.categories || data.categories;
      builderCats = backup.builderCategories || builderCats;
      data.settings = backup.settings || data.settings;
      prompts = backup.prompts || prompts;
      normalizeBuilderCats();
      if(!Array.isArray(data.settings.promptCategories)) data.settings.promptCategories = [];
    }else{
      (backup.builderCategories||[]).forEach(bc=>{
        let cat = builderCats.find(c=>c.name===bc.name);
        if(!cat){ cat = {id:uid(), name:bc.name, phrases:[]}; builderCats.push(cat); }
        (bc.phrases||[]).forEach(bp=>{
          if(!cat.phrases.some(p=>p.japanese===bp.japanese)) cat.phrases.push({id:uid(), japanese:bp.japanese, english:bp.english||'', ...(bp.createdAt ? {createdAt:bp.createdAt} : {})});
        });
      });
      (backup.prompts||[]).forEach(bp=>{
        if(!prompts.some(p=>p.name===bp.name && p.positiveSentence===bp.positiveSentence)){
          prompts.push({...bp, id:uid()});
        }
      });
    }
    await storageSet('library', JSON.stringify(data.categories));
    await saveBuilderCats();
    await saveSettings(); await savePrompts();
    document.getElementById('triggerWord').value = data.settings.triggerWord||'';
    document.getElementById('qualityPrefix').value = data.settings.qualityPrefix||'';
    document.getElementById('negativeCommon').value = data.settings.negativeCommon||'';
    builderSelectedCatId = builderCats[0] ? builderCats[0].id : null;
    renderSettingsSummary();
    renderPromptList();
    resultEl.textContent = '復元が完了しました。';
  }catch(err){
    resultEl.textContent = '読み込みに失敗しました: ' + (err && err.message ? err.message : String(err));
  }
  e.target.value = '';
});
